<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAMV1 — Privileged Access Management</title>
<style>
  :root {
    color-scheme: dark;
    /* green (default phosphor palette) — every value below is exactly what was
       previously hardcoded, so the default look is pixel-for-pixel unchanged. */
    --bg: #050705;
    --fg: #2eff7b;
    --fg-glow: rgba(46,255,123,.35);
    --fg-white: #eaffea;
    --fg-white-glow: rgba(234,255,234,.35);
    --fg-cyan: #4be0e0;
    --fg-cyan-glow: rgba(75,224,224,.35);
    --fg-red: #ff4d4d;
    --fg-red-glow: rgba(255,77,77,.45);
    --fg-amber: #ffcf55;
    --fg-amber-glow: rgba(255,207,85,.4);
    --rule: #123c1f;
    --input-bg: #041407;
    --focus-bg: #0a2a12;
    --fg-dim: #2f7d4a;
    --pane-bg: #020402;
    --scanline: rgba(0,0,0,.22);
  }
  /* amber — classic amber-phosphor terminal. --fg and --fg-amber trade places
     (green becomes the accent instead of the primary glow); background stays
     black, only the phosphor color changes. */
  :root[data-theme="amber"] {
    --fg: #ffcf55;
    --fg-glow: rgba(255,207,85,.4);
    --fg-white: #fff4e0;
    --fg-white-glow: rgba(255,244,224,.35);
    --fg-amber: #2eff7b;
    --fg-amber-glow: rgba(46,255,123,.35);
    --rule: #3c2c12;
    --input-bg: #140c04;
    --focus-bg: #2a1c0a;
    --fg-dim: #7d5f2f;
    --pane-bg: #040302;
  }
  /* slate — a neutral, cooler dark palette: light gray on near-black instead of
     a saturated glow, for lower glare while staying unmistakably the same
     terminal (same grid, same monospace, same scanlines — just a quieter tube). */
  :root[data-theme="slate"] {
    --bg: #0a0c0e;
    --fg: #cfd6dc;
    --fg-glow: rgba(207,214,220,.12);
    --fg-white: #f5f7f9;
    --fg-white-glow: rgba(245,247,249,.15);
    --fg-cyan: #6fb8d1;
    --fg-cyan-glow: rgba(111,184,209,.15);
    --fg-red: #e07070;
    --fg-red-glow: rgba(224,112,112,.18);
    --fg-amber: #d1a45f;
    --fg-amber-glow: rgba(209,164,95,.15);
    --rule: #262b30;
    --input-bg: #14171a;
    --focus-bg: #1e2226;
    --fg-dim: #6b7480;
    --pane-bg: #08090b;
    --scanline: rgba(0,0,0,.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.35 "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    text-shadow: 0 0 5px var(--fg-glow);
    display: flex; justify-content: center;
  }
  body::after { /* CRT scanlines */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px);
  }
  #term { width: 100%; max-width: 980px; padding: 12px 16px; white-space: pre-wrap; }
  a, .green { color: var(--fg); }
  .white { color: var(--fg-white); text-shadow: 0 0 5px var(--fg-white-glow); }
  .cyan  { color: var(--fg-cyan); text-shadow: 0 0 5px var(--fg-cyan-glow); }
  .red   { color: var(--fg-red); text-shadow: 0 0 5px var(--fg-red-glow); }
  .amber { color: var(--fg-amber); text-shadow: 0 0 5px var(--fg-amber-glow); }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .row { display: flex; justify-content: space-between; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 1px 8px 1px 0; font-weight: normal; white-space: nowrap; }
  th { color: var(--fg-white); }
  td.detail { white-space: normal; }
  input, select {
    font: inherit; color: var(--fg); background: var(--input-bg);
    border: 0; border-bottom: 1px solid var(--fg); outline: none; padding: 0 2px;
    text-shadow: inherit; caret-color: var(--fg);
  }
  select { border: 1px solid var(--rule); }
  input:focus, select:focus, a:focus { background: var(--focus-bg); outline: 1px solid var(--fg-cyan); }
  input.opt { width: 3ch; text-align: center; text-transform: uppercase; }
  input[type=checkbox] { width: auto; }
  .fkeys { color: var(--fg-cyan); margin-top: 8px; }
  .khint { color: var(--fg-dim); margin-top: 2px; font-size: 0.9em; }
  .msg { min-height: 1.3em; color: var(--fg-white); }
  .msg.err { color: var(--fg-red); }
  form.inline { display: inline; }
  label { display: block; }
  .indent { margin-left: 4ch; }
  /* Live session watch pane (Phase 16 monitoring viewer). */
  .watchpane { height: 55vh; overflow-y: auto; background: var(--pane-bg);
    border: 1px solid var(--rule); padding: 4px 6px; white-space: pre-wrap;
    word-break: break-all; margin: 4px 0; }
  /* In-portal graphical viewer overlay, RDP and VNC alike (Guacamole canvas).
     The rdp* class names predate VNC; both viewers share this one overlay. */
  .rdpwrap { position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; flex-direction: column; }
  .rdpbar { flex: 0 0 auto; padding: 4px 12px; border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
  .rdpview { position: relative; flex: 1 1 auto; overflow: auto; display: flex;
    justify-content: center; align-items: flex-start; background: #000; }
  .rdpview canvas { image-rendering: pixelated; }
  /* Session watermark (Phase 137): a static, non-interactive identity overlay
     — who is connected, and when — deterring an unauthorized screenshot of a
     privileged session and identifying one if it leaks anyway. pointer-events
     none so it never intercepts the mouse/keyboard input Guac.Mouse/Keyboard
     bind to this same element. */
  .rdpwatermark { position: absolute; inset: 0; z-index: 5; pointer-events: none;
    overflow: hidden; display: flex; flex-wrap: wrap; align-content: space-evenly;
    justify-content: space-evenly; user-select: none; }
  .rdpwatermark span { transform: rotate(-30deg); white-space: nowrap;
    opacity: .16; color: var(--fg-white); font: 12px ui-monospace, "SF Mono", Consolas, monospace; }
</style>
</head>
<body>
<div id="term"></div>
<script nonce="__CSP_NONCE__">
(() => {
  const term = document.getElementById("term");
  // Portal color theme (Phase 126): a cosmetic, client-only preference — no
  // store table, no API route, no audit event. Applied before the first
  // render so there is no flash of the wrong palette. "" (green) needs no
  // attribute at all, since :root already IS the green palette by default.
  const THEMES = ["", "amber", "slate"];
  const savedTheme = localStorage.getItem("pam_theme") || "";
  if (THEMES.includes(savedTheme) && savedTheme) document.documentElement.dataset.theme = savedTheme;
  let apiKey = sessionStorage.getItem("pam_api_key") || "";
  let me = null; // { name, role, break_glass, capabilities:[] }

  // Pick up a token/error handed back by the OIDC callback or the SAML ACS in the URL fragment.
  let ssoMsg = "", ssoErr = false;
  if (location.hash.length > 1) {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("pam_token")) { apiKey = h.get("pam_token"); sessionStorage.setItem("pam_api_key", apiKey); ssoMsg = "SINGLE SIGN-ON COMPLETE."; }
    else if (h.get("pam_error")) { ssoMsg = "SSO FAILED: " + h.get("pam_error").toUpperCase(); ssoErr = true; }
    history.replaceState(null, "", location.pathname + location.search);
  }

  let screen = apiKey ? "main" : "signon";
  let back = "main";
  let msg = ssoMsg, msgErr = ssoErr;
  // Per-screen data.
  let targets = [], creds = [], audit = [], sessions = [], requests = [], checkouts = [], users = [], grants = [];
  let apps = [], appGrants = [], grantsApp = 0, newApp = null;
  let viewCred = null, grantsTarget = 0, newUser = null, mfaInfo = null, mfaEnroll = null, recoveryCodes = [], discovered = null, reconcileReport = null, acctScan = null;
  let webauthnCreds = []; // Phase 124: the caller's own registered FIDO2/WebAuthn authenticators
  let profiles = [], configItems = [], configNote = "", effCfg = null, iacText = "", iacFormat = "";
  let safes = [], safeMembers = [], membersSafe = 0, safeTarget = null;
  let editTarget = null, editSafe = null, editUser = null; // 2=Change subjects (Phase 44)
  // Phase 45: the remaining console screens.
  let vendors = [], vendorGrants = [], grantsVendor = 0, newVendor = null, editVendor = null;
  let sshCerts = [], caInfo = null, loginSessions = [], agents = [], newAgent = null;
  let endpointAgents = [], newEndpointAgent = null; // Phase 153: outbound-only endpoint agents
  let quarantine = []; // Phase 159: quarantined agent identities (agent-key name, or a full SPIFFE ID)
  let dlockCred = null;  // Phase 187: the credential DoubleLock is being set on
  let scimKeys = [];     // Phase 187: SCIM client keys (menu 29)
  let newScimKey = null; // shown once, like an agent key
  let extToken = null;   // Phase 187: a minted browser-extension token, shown once
  let identities = []; // Phase 170: SPIFFE agent identities and the human accountable for each
  let ownerIdentity = null; // the registration whose owner is being reassigned
  let budgetAgent = null; // Phase 167: the agent whose daily call budget option 7 is editing
  let kubeTarget = null, kubeResult = null, kubeErr = ""; // Phase 155: brokered kubectl operations
  // Phase 189: the answer to "what can this subject reach?" — the grant model
  // read from the subject's side (menu 31), plus the query that produced it so
  // F5 can re-ask it.
  let reachAnswer = null, reachSubject = "", reachKind = "user";
  let deps = [], depsCred = null, blastResult = null, auditHead = null, nis2Report = null;
  let nis2Since = "", nis2Until = "";
  let campaigns = [], campView = null, risk = null, riskMin = "", riskWin = "";
  let assignItem = null, myQueue = [];
  let brokerApprovals = [], stepUps = [];
  let watchSess = null, watchAbort = null, watchText = "";
  let liveTimer = null;
  // Session-sharing (Phase 116): roster is the current watch session's joined
  // parties; shareInvites/shareInviteSid back the per-session invite list;
  // newShareToken holds a just-approved INTERNAL invite's one-time token.
  let roster = [], shareInvites = [], shareInviteSid = null, newShareToken = null;
  let watchSuspended = false; // Phase 122: current watch session's suspend status
  let recordings = [], replay = null; // replay = one loaded recording + player state
  let recSearchQuery = "", recSearchHits = null, recSearchErr = ""; // null = no search run yet
  let replaySource = "recordings"; // where F12 returns from recplay: the list, or a search that led here
  let tokenKeys = null, tokenEvents = []; // RFC 8693 signing key + delegation history

  // The Apache Guacamole client (vendored) powers the in-portal RDP viewer. It is
  // imported on demand — the first time an operator opens RDP — so the ~75KB module
  // never loads for the sign-on screen, non-RDP roles, or guacd-disabled deploys.
  // GUAC_SRC is a content-addressed path (…?v=<hash>) so an upgrade busts the cache.
  const GUAC_SRC = "__GUAC_SRC__";
  let rdpActive = false, guacPromise = null; // rdpActive: a graphical viewer (RDP or VNC) owns the keyboard
  function loadGuac() {
    // Memoize the resolved module, but reset on failure so a transient error retries.
    if (!guacPromise) {
      guacPromise = import(GUAC_SRC).then((m) => m.default)
        .catch((e) => { guacPromise = null; throw e; });
    }
    return guacPromise;
  }

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (s, n) => esc(String(s ?? "")).padEnd(n);
  // cell() is pad() that TRUNCATES first. Use it for any value a user controls —
  // a name, a subject, a SPIFFE id — and pad() only for values bounded by their
  // own domain (a status, a kind, a count). pad() alone lets one long value push
  // every column after it off a 980px terminal, which on a refused row is where
  // the reason lives; that shipped once and is now a test
  // (internal/web/testdata/console_check.js asserts a row does not widen with
  // its data).
  const cell = (s, n) => { s = String(s ?? ""); return pad(s.length > n ? s.slice(0, n - 1) + "…" : s, n); };
  const can = (c) => !!(me && me.capabilities && me.capabilities.includes(c));
  const fmtTime = (t) => t ? esc(String(t).replace("T", " ").slice(0, 19)) : "-";
  const now = () => { const d = new Date(), z = (x) => String(x).padStart(2, "0");
    return `${z(d.getDate())}/${z(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}  ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { "X-API-Key": apiKey, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    // 202 means ACCEPTED, not done: the kill was broadcast to the cluster because
    // the session is hosted on another replica, and nothing here has confirmed it
    // died. Reporting it as success is how the portal used to say "SESSION ENDED"
    // for a kill it could not vouch for — including, before the API was fixed, for
    // ids that never existed.
    if (res.status === 202) return { __accepted: true };
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error((data.error || res.statusText).toUpperCase());
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // b64uToBuf/bufToB64u convert between the base64url strings the WebAuthn
  // wire format carries (JSON has no binary type) and the ArrayBuffers the
  // browser's navigator.credentials API actually requires — every
  // challenge/id/signature crosses this boundary exactly once each way.
  function b64uToBuf(b64u) {
    const b64 = b64u.replace(/-/g, "+").replace(/_/g, "/");
    const pad = b64.length % 4 ? "=".repeat(4 - (b64.length % 4)) : "";
    const bin = atob(b64 + pad);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf.buffer;
  }
  function bufToB64u(buf) {
    const bytes = new Uint8Array(buf);
    let bin = "";
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  // webauthnCreate drives navigator.credentials.create() from the server's
  // POST /api/webauthn/register/begin response, and returns the wire JSON
  // POST /api/webauthn/register/finish expects — the exact shape
  // protocol.CredentialCreationResponse decodes.
  async function webauthnCreate(opts) {
    const pk = opts.publicKey;
    pk.challenge = b64uToBuf(pk.challenge);
    pk.user.id = b64uToBuf(pk.user.id);
    for (const c of pk.excludeCredentials || []) c.id = b64uToBuf(c.id);
    const cred = await navigator.credentials.create({ publicKey: pk });
    return {
      id: cred.id, type: cred.type, rawId: bufToB64u(cred.rawId),
      response: {
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
        attestationObject: bufToB64u(cred.response.attestationObject),
      },
    };
  }

  // webauthnGet is webauthnCreate's login-side mirror: drives
  // navigator.credentials.get() from POST /api/webauthn/login/begin's
  // response, returns what POST /api/webauthn/login/finish expects.
  async function webauthnGet(opts) {
    const pk = opts.publicKey;
    pk.challenge = b64uToBuf(pk.challenge);
    for (const c of pk.allowCredentials || []) c.id = b64uToBuf(c.id);
    const cred = await navigator.credentials.get({ publicKey: pk });
    return {
      id: cred.id, type: cred.type, rawId: bufToB64u(cred.rawId),
      response: {
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
        authenticatorData: bufToB64u(cred.response.authenticatorData),
        signature: bufToB64u(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : undefined,
      },
    };
  }

  // apiAll drains a cursor-paged list endpoint (Phase 44): the API caps every
  // page at 500 rows, so follow the ?after= cursor until a short page comes
  // back. Keeps the subfiles complete while each request stays bounded.
  async function apiAll(path) {
    const sep = path.includes("?") ? "&" : "?";
    let out = [], after = 0;
    for (;;) {
      const page = await api("GET", `${path}${sep}limit=500&after=${after}`);
      out = out.concat(page);
      if (!Array.isArray(page) || page.length < 500) return out;
      after = page[page.length - 1].id;
    }
  }

  // loadMe resolves the caller's identity + capabilities so the menu shows only
  // the options the role may use. Panels still tolerate a 403 as a backstop.
  async function loadMe() { me = await api("GET", "/api/me"); }

  const say = (t, err) => { msg = t; msgErr = !!err; };
  function stopLive() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

  function head(id, title) {
    return `<div class="row"><span class="white">${id}</span><span>${title}</span><span class="white">SYSTEM: PAMV1</span></div>` +
           `<div class="row"><span>${me ? esc(me.name) + " / " + esc(me.role) + (me.break_glass ? " (BREAK-GLASS)" : "") : ""}</span><span class="cyan">${now()}</span></div><hr>`;
  }
  const fkeys = (t) => `<hr><div class="fkeys">${t}</div>` +
    `<div class="khint">Enter=Confirm&nbsp;&nbsp;Esc=Back&nbsp;&nbsp;Tab / ↑↓=Move&nbsp;&nbsp;F2=Theme&nbsp;&nbsp;(the mouse is optional)</div>` +
    `<div class="msg${msgErr ? " err" : ""}">${esc(msg)}</div>`;

  // opt renders a subfile option input; optCell reads the typed option for a row.
  const opt = (id) => `<input class="opt" name="o${esc(id)}" maxlength="1">`;
  const optVal = (form, id) => (form["o" + id]?.value || "").trim();

  // --- async openers: fetch the screen's data, then render it. Also used by F5. ---
  async function openTargets() { try { [targets, safes] = await Promise.all([apiAll("/api/targets"), apiAll("/api/safes").catch(() => safes)]); } catch (e) { targets = []; } go("targets"); }
  async function openCreds() { try { [targets, creds] = await Promise.all([apiAll("/api/targets").catch(() => []), apiAll("/api/credentials")]); } catch (e) { creds = []; } go("creds"); }
  async function openSessions() { try { sessions = await api("GET", "/api/sessions"); } catch (e) { sessions = []; } go("sessions"); }
  async function openCheckouts() { try { [targets, checkouts] = await Promise.all([apiAll("/api/targets").catch(() => []), apiAll("/api/checkouts?active=true")]); } catch (e) { checkouts = []; } go("checkouts"); }
  async function openUsers() { try { [users, profiles] = await Promise.all([apiAll("/api/users"), api("GET", "/api/profiles").catch(() => [])]); } catch (e) { users = []; } go("users"); }
  async function openProfiles() { try { profiles = await api("GET", "/api/profiles"); } catch (e) { profiles = []; } go("profiles"); }
  async function openConfig() { try { const r = await api("GET", "/api/config"); configItems = r.settings || []; configNote = r.note || ""; } catch (e) { configItems = []; } go("config"); }
  async function openEffective() { try { effCfg = await api("GET", "/api/config/effective"); } catch (e) { effCfg = null; } go("effective"); }
  async function openMfa() { try { mfaInfo = await api("GET", "/api/mfa"); } catch (e) { mfaInfo = { enrolled: false, confirmed: false }; } go("mfa"); }
  async function openMfaWebAuthn() { try { const r = await api("GET", "/api/webauthn/credentials"); webauthnCreds = r.credentials || []; } catch (e) { webauthnCreds = []; } go("mfawebauthn"); }
  async function openAudit() { try { audit = await api("GET", "/api/audit?limit=100"); } catch (e) { audit = []; } go("audit"); }
  async function openReconcile() { reconcileReport = null; try { reconcileReport = await api("GET", "/api/reconcile"); } catch (e) {} go("reconcile"); }
  async function openGrants(tid) { grantsTarget = tid; try { grants = await api("GET", `/api/targets/${tid}/grants`); } catch (e) { grants = []; } go("grants"); }
  // Broker approvals (Phase 43): a parked agent tool call waits for a human. The
  // routes exist only when the broker is enabled, so a 404 shows a hint rather
  // than an error, matching the application-secrets screen.
  async function openBrokerApprovals() {
    brokerApprovals = [];
    try { brokerApprovals = await api("GET", "/v1/approvals"); }
    catch (e) { if (e.status === 404) say("AI-AGENT BROKER IS DISABLED (set PAM_BROKER_POLICY_FILE)."); }
    go("brokerapprovals");
  }
  // Safe policy (Phase 58): a safe can require approval for every target it holds
  // and set a dual-control floor. Rendered short for the 5250 list column.
  function safePolicy(s) {
    if (s.min_approvers > 0) return `required (${s.min_approvers} approvers)`;
    return s.require_approval ? "required" : "-";
  }
  // safeBody coerces the safe form into the API's types: a checkbox is a bool,
  // a number input is still a string in FormData.
  function safeBody(f, form) {
    return { name: f.name, description: f.description,
             require_approval: form.require_approval.checked,
             min_approvers: Number(f.min_approvers || 0) };
  }
  // Step-ups (Phase 43): a paused statement is waiting on a supervisor and will
  // be refused when its TTL expires, so this screen is time-critical.
  async function openStepUps() {
    stepUps = [];
    try { stepUps = await api("GET", "/api/sessions/stepups"); } catch (e) {}
    go("stepups");
  }
  // Session-sharing (Phase 116). refreshRoster is called both on a timer
  // while sesswatch is showing and right after a kick, so it re-renders only
  // when that screen is still the one showing (a stray late response after
  // navigating away must not resurrect it).
  async function refreshRoster(sid) {
    try { roster = await api("GET", `/api/sessions/${sid}/share/roster`); } catch (e) { roster = []; }
    // Phase 122: piggybacks on the same 5s refresh tick rather than its own
    // timer — one poll, two facts. A read-only auditor without CapApprove
    // can still see status (CapReadAudit-gated), just not act on it, so this
    // call itself must not be treated as a sign the F-key should be offered.
    try { watchSuspended = (await api("GET", `/api/sessions/${sid}/suspend`)).suspended; } catch (e) { watchSuspended = false; }
    if (screen === "sesswatch") render();
  }
  // Phase 122: F8 on the watch pane toggles freeze/unfreeze based on the
  // status this same screen already polled — one key, both directions,
  // rather than two separate F-keys for what is really one on/off switch.
  async function toggleSuspend() {
    if (!watchSess) return;
    const verb = watchSuspended ? "resume" : "suspend";
    await api("POST", `/api/sessions/${watchSess.id}/${verb}`, {});
    say(watchSuspended ? "SESSION RESUMED." : "SESSION SUSPENDED — operator input is now frozen.");
    await refreshRoster(watchSess.id);
  }
  async function openShareInvites(sid) {
    shareInviteSid = sid; shareInvites = [];
    try { shareInvites = await api("GET", `/api/sessions/${sid}/share`); } catch (e) {}
    go("shareinvites");
  }
  async function openRequests() {
    requests = [];
    if (can("approve")) { try { requests = await apiAll("/api/access-requests"); } catch (e) {} }
    if (targets.length === 0) { try { targets = await apiAll("/api/targets"); } catch (e) {} }

  // Agent keys (Phase 13): the routes exist only when the broker is enabled, so
  // a 404 shows a hint rather than an error — the app-secrets screen's pattern.
  // unquoteDetail reverses the strconv.Quote the server applies to untrusted
  // audit text (auditField). Go's quoting is JSON-string compatible, so JSON.parse
  // is the inverse. Text that is not quoted is returned as-is.
  function unquoteDetail(s) {
    const t = String(s ?? "").trim();
    if (!t.startsWith('"')) return t;
    try { return JSON.parse(t); } catch (e) { return t; }
  }

  // detailFields splits a `key:value key:value` audit detail.
  //
  // Two shapes have to work, because the server quotes at two different
  // granularities: the token-exchange success detail is quoted WHOLE
  // (`auditField` over the entire string), while a refusal quotes each untrusted
  // VALUE separately (`delegator:"…" reason:"…"`). So the whole string is
  // unquoted first, and then each value is unquoted again if it is itself quoted.
  //
  // Values are scanned rather than split on whitespace: a quoted value may
  // legitimately contain spaces, and a SPIFFE ID is mostly colons and slashes —
  // so a key ends at its FIRST colon and its value is either a JSON string or a
  // run of non-space characters.
  function detailFields(s) {
    const src = unquoteDetail(s);
    const out = {};
    let i = 0;
    while (i < src.length) {
      while (i < src.length && /\s/.test(src[i])) i++;
      const colon = src.indexOf(":", i);
      if (colon < 0) break;
      const key = src.slice(i, colon);
      i = colon + 1;
      if (src[i] === '"') {
        // Consume a quoted value, honouring backslash escapes.
        let j = i + 1;
        while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1;
        out[key] = unquoteDetail(src.slice(i, Math.min(j + 1, src.length)));
        i = j + 1;
      } else {
        let j = i;
        while (j < src.length && !/\s/.test(src[j])) j++;
        out[key] = src.slice(i, j);
        i = j;
      }
    }
    return out;
  }

  // openTokenExchange loads the RFC 8693 view (Phase 57's console follow-on):

  // the broker signs it and forgets it — so the audited broker.token.exchanged
  // event is the only record that a delegation ever existed. That is also why
  // this screen is read-only: minting is an agent presenting its own credential
  // to POST /v1/token, which a human at a terminal cannot do on its behalf, and
  // should not be able to.
  async function openTokenExchange() {
    tokenKeys = null; tokenEvents = [];
    try { tokenKeys = await api("GET", "/v1/token/jwks"); }

    } catch (e) { tokenEvents = []; }
    go("tokenexchange");
  }

  // download fetches an authenticated export and hands it to the browser as a
  // file, surfacing the digest header when the endpoint stamps one.
  async function download(path, filename, label) {
    const res = await fetch(path, { headers: { "X-API-Key": apiKey } });
    if (!res.ok) { say("CPF9999: EXPORT FAILED (" + res.status + ")", true); render(); return; }
    const digest = res.headers.get("X-PAM-Export-SHA256") || "";
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    say(label + " EXPORTED" + (digest ? " — SHA256 " + digest.slice(0, 16) + "…" : "."));
    render();
  }

  // stripCtl removes ANSI escape sequences and carriage returns from a live
  // terminal frame so the watch pane shows readable text, not control codes.
  const stripCtl = (t) => t.replace(/\x1b(?:\[[0-9;?]*[ -\/]*[@-~]|\][^\x07\x1b]*(?:\x07|\x1b\\)?|[@-Z\\-_])/g, "").replace(/\r/g, "");

  // appendWatch adds a live frame to the watch pane, keeping only the most
  // recent output bounded so a long session cannot grow the DOM without limit.
  function appendWatch(t) {
    watchText = (watchText + stripCtl(t)).slice(-65536);
    const pane = document.getElementById("watch-pane");
    if (pane) { pane.textContent = watchText; pane.scrollTop = pane.scrollHeight; }
  }
  // stopWatch aborts the SSE stream and clears the viewer state; go() calls it
  // whenever navigation leaves the watch screen.
  function stopWatch() {
    if (watchAbort) { watchAbort.abort(); watchAbort = null; }
    watchSess = null; watchText = "";
  }

  // watchSession opens the live monitor for a session (Phase 16): it reads the
  // GET /api/sessions/{id}/stream SSE endpoint with fetch — EventSource cannot
  // send the X-API-Key header — and renders each output frame into the pane.
  // The watch is view-only and is itself audited server-side (session.monitor).
  async function watchSession(s) {
    stopWatch();
    watchSess = s;
    roster = [];
    watchSuspended = false;
    go("sesswatch");
    refreshRoster(s.id);
    const ctrl = new AbortController();
    watchAbort = ctrl;
    try {
      const res = await fetch(`/api/sessions/${s.id}/stream`, { headers: { "X-API-Key": apiKey }, signal: ctrl.signal });
      if (!res.ok) throw new Error("STREAM UNAVAILABLE (" + res.status + ")");
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, i); buf = buf.slice(i + 2);
          for (const line of ev.split("\n")) {
            // The server escapes BOTH line terminators (sseEscape: CR -> \r,
            // LF -> \n — either would end the SSE data field). Undo both; the
            // restored real CRs are then dropped by stripCtl, so terminal
            // CRLF output renders as clean lines instead of trailing "\r"
            // literals on every watched line.
            if (line.startsWith("data: ")) appendWatch(line.slice(6).replaceAll("\\r", "\r").replaceAll("\\n", "\n"));
          }
        }
      }
      if (screen === "sesswatch" && !ctrl.signal.aborted) { say("SESSION ENDED — STREAM CLOSED."); render(); }
    } catch (e) {
      if (screen === "sesswatch" && !ctrl.signal.aborted) { say("CPF9999: " + String(e.message || e).toUpperCase(), true); render(); }
    }
  }

  // --- session-recording replay (Phase 26) ---

  // openRecordings loads the stored-recordings listing (auditor view of what
  // the proxies recorded to disk).
  async function openRecordings() { try { recordings = await api("GET", "/api/recordings"); } catch (e) { recordings = []; } go("recordings"); }

  // openReplay fetches one recording (raw asciicast or transcript — api() JSON
  // helper does not fit) plus the server's tamper-evidence headers: the
  // recomputed SHA-256 and whether that hash appears in the audit trail.
  // A captured SFTP file (kind "file", Phase 59) has nothing to replay in a
  // terminal pane: the server reconstructs the transferred bytes and they are
  // downloaded instead — audited (session.playback) and hash-checked the same.
  // seekSeconds (Phase 110, from a content-search hit) lands the player
  // paused at that time with everything up to it already on screen, instead
  // of starting playback from the beginning.
  async function openReplay(rec, seekSeconds) {
    if (rec.kind === "file") return downloadCaptured(rec);
    const res = await fetch(`/api/recordings/${encodeURIComponent(rec.name)}`, { headers: { "X-API-Key": apiKey } });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error((d.error || res.statusText).toUpperCase()); }
    const body = await res.text();
    const frames = [];
    if (rec.kind === "asciicast") {
      // asciicast v2: one JSON value per line — a header object, then
      // [time, "o", data] output events (our recorders only write "o").
      for (const line of body.split("\n")) {
        if (!line.trim()) continue;
        try {
          const ev = JSON.parse(line);
          if (Array.isArray(ev) && ev[1] === "o") frames.push({ t: ev[0], text: String(ev[2]) });
        } catch (e) { /* skip an unparsable line rather than lose the replay */ }
      }
    } else {
      frames.push({ t: 0, text: body });
    }
    stopReplay();
    replay = {
      name: rec.name, kind: rec.kind, frames,
      total: frames.length ? frames[frames.length - 1].t : 0,
      sha: res.headers.get("X-PAM-Recording-SHA256") || "",
      audited: res.headers.get("X-PAM-Recording-Audited") === "true",
      i: 0, pos: 0, speed: 1, playing: false, timer: null, text: "",
    };
    replaySource = seekSeconds != null ? "recsearch" : "recordings";
    go("recplay");
    if (seekSeconds != null) replaySeekTo(seekSeconds); else replayPlay();
  }

  // openRecSearch opens the content-search screen. It does not load anything
  // up front — a search only runs once the operator submits a query, since
  // the server has to open and (if sealed) decrypt every candidate recording,
  // unlike the plain listing.
  function openRecSearch() { recSearchErr = ""; go("recsearch"); }

  // runRecSearch submits a content search and stores the results (or the
  // error) for the recsearch screen to render.
  async function runRecSearch(q) {
    recSearchQuery = q;
    try { recSearchHits = await api("GET", "/api/recordings/search?q=" + encodeURIComponent(q)); recSearchErr = ""; }
    catch (e) { recSearchHits = null; recSearchErr = e.message; }
    render();
  }

  // downloadCaptured saves the reconstructed content of a captured SFTP file
  // and reports the SAME tamper verdict a replayed recording gets. The generic
  // download() helper only knows about export digests, so using it here threw
  // the verdict away — leaving captured content the one artifact type whose
  // "hash not found in the audit trail" went unsaid.
  async function downloadCaptured(rec) {
    const res = await fetch(`/api/recordings/${encodeURIComponent(rec.name)}`, { headers: { "X-API-Key": apiKey } });
    if (!res.ok) { const d = await res.json().catch(() => ({})); say("CPF9999: " + (d.error || res.statusText).toUpperCase(), true); render(); return; }
    const sha = res.headers.get("X-PAM-Recording-SHA256") || "";
    const audited = res.headers.get("X-PAM-Recording-Audited") === "true";
    const path = res.headers.get("X-PAM-SFTP-Path") || "";
    const partial = res.headers.get("X-PAM-SFTP-Sparse") === "true" || res.headers.get("X-PAM-SFTP-Truncated") === "true";
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement("a");
    a.href = url; a.download = rec.name.replace(/\.sftp$/, ".bin"); a.click();
    URL.revokeObjectURL(url);
    say((audited ? "FILE CONTENT SAVED — HASH VERIFIED IN AUDIT TRAIL" : "FILE CONTENT SAVED — HASH NOT FOUND IN AUDIT TRAIL (TAMPERED, TRIMMED OR NEVER AUDITED)") +
        (partial ? " — INCOMPLETE CAPTURE" : "") + (path ? " — " + path : "") + (sha ? " — SHA256 " + sha.slice(0, 16) + "…" : ""), !audited || partial);
    render();
  }

  // stopReplay halts the player and drops its state; go() calls it whenever
  // navigation leaves the replay screen.
  function stopReplay() { if (replay) { clearTimeout(replay.timer); replay = null; } }

  // replayStatus repaints the player's status line and pane in place (no full
  // re-render per frame).
  function replayStatus() {
    if (!replay) return;
    const mmss = (s) => { const v = Math.max(0, Math.round(s)); return `${String(Math.floor(v / 60)).padStart(2, "0")}:${String(v % 60).padStart(2, "0")}`; };
    const st = document.getElementById("rp-status");
    if (st) st.textContent = `TIME ${mmss(replay.pos)} / ${mmss(replay.total)}   FRAME ${replay.i}/${replay.frames.length}   SPEED ${replay.speed === "MAX" ? "MAX" : replay.speed + "x"}   ${replay.playing ? "PLAYING" : replay.i >= replay.frames.length ? "END OF RECORDING" : "PAUSED"}`;
    const pane = document.getElementById("replay-pane");
    if (pane) { pane.textContent = replay.text; pane.scrollTop = pane.scrollHeight; }
  }

  // replayStep shows the next frame and schedules the one after it, compressing
  // long idle gaps (asciinema-style) so a quiet session replays briskly.
  function replayStep() {
    if (!replay || replay.i >= replay.frames.length) { if (replay) replay.playing = false; replayStatus(); return; }
    const f = replay.frames[replay.i++];
    replay.text = (replay.text + stripCtl(f.text)).slice(-65536);
    replay.pos = f.t;
    replayStatus();
    if (replay.i >= replay.frames.length) { replay.playing = false; replayStatus(); return; }
    if (replay.speed === "MAX") { replayStep(); return; }
    const gap = Math.min(Math.max(replay.frames[replay.i].t - f.t, 0), 2); // cap idle at 2s
    replay.timer = setTimeout(replayStep, (gap * 1000) / replay.speed);
  }

  // replayPlay / replayToggle / replayRestart / replayCycleSpeed are the
  // keyboard controls: Space pauses, F5 restarts, F6 cycles 1x→2x→4x→8x→MAX.
  function replayPlay() { if (!replay || replay.playing) return; if (replay.i >= replay.frames.length) return; replay.playing = true; replayStep(); }
  function replayToggle() {
    if (!replay) return;
    if (replay.playing) { clearTimeout(replay.timer); replay.playing = false; replayStatus(); }
    else replayPlay();
  }
  function replayRestart() {
    if (!replay) return;
    clearTimeout(replay.timer);
    replay.i = 0; replay.pos = 0; replay.text = ""; replay.playing = false;
    replayPlay();
  }
  function replayCycleSpeed() {
    if (!replay) return;
    const speeds = [1, 2, 4, 8, "MAX"];
    replay.speed = speeds[(speeds.indexOf(replay.speed) + 1) % speeds.length];
    if (replay.speed === "MAX" && replay.playing) { clearTimeout(replay.timer); replayStep(); }
    replayStatus();
  }

  // replaySeekTo (Phase 110) fast-forwards synchronously — no per-frame
  // delay, unlike normal playback — through every frame up to and including
  // seconds, then stops there paused. The pane ends up showing everything up
  // to the jump point, so a search hit lands with the match already visible
  // in context rather than the operator having to scrub for it. Space
  // resumes ordinary timed playback from there, exactly as if it had played
  // there normally.
  function replaySeekTo(seconds) {
    if (!replay) return;
    clearTimeout(replay.timer);
    replay.i = 0; replay.pos = 0; replay.text = ""; replay.playing = false;
    while (replay.i < replay.frames.length && replay.frames[replay.i].t <= seconds) {
      const f = replay.frames[replay.i++];
      replay.text = (replay.text + stripCtl(f.text)).slice(-65536);
      replay.pos = f.t;
    }
    replayStatus();
  }

  // buildWatermark returns a non-interactive overlay identifying who is
  // connected and when (Phase 137, BeyondTrust-style session watermarking):
  // a repeating, low-opacity, rotated label, static text (not a moving/
  // dynamic tracking pattern — deliberately simple, v1 scope). One tile is
  // enough to fill the viewport via flex-wrap; the exact count only affects
  // density, not correctness.
  function buildWatermark(targetName) {
    const el = document.createElement("div");
    el.className = "rdpwatermark";
    const label = `${me && me.name ? me.name : "?"} · ${targetName} · ${new Date().toLocaleString()}`;
    for (let i = 0; i < 24; i++) {
      const span = document.createElement("span");
      span.textContent = label;
      el.appendChild(span);
    }
    return el;

  // startViewer builds the fullscreen viewer overlay, wires the Guacamole client to
  // the WebSocket tunnel, and forwards keyboard/mouse. Keyboard/Mouse are bound to
  // the overlay element (not document), so removing the overlay on teardown drops
  // every listener — guacamole-common-js has no detach API. Ctrl+Alt+Q disconnects
  // and is swallowed inside onkeydown so the chord never reaches the remote host.
  function startViewer(Guac, t, tok, v) {
    const wrap = document.createElement("div"); wrap.className = "rdpwrap"; wrap.tabIndex = -1;
    const bar = document.createElement("div"); bar.className = "rdpbar";
    bar.innerHTML = `<span><span class="white">${esc(v.label)}</span> ${esc(t.name)} <span class="cyan">${esc(t.host)}:${esc(t.port || v.port)}</span></span>` +
      `<span class="amber">Ctrl+Alt+Q = disconnect</span>`;
    const view = document.createElement("div"); view.className = "rdpview";
    wrap.appendChild(bar); wrap.appendChild(view); document.body.appendChild(wrap);
    wrap.focus(); // the overlay must hold focus to receive key events
    rdpActive = true;

    const w = Math.max(640, Math.min(view.clientWidth || 1024, 4096));
    const h = Math.max(480, Math.min((window.innerHeight - 30) || 768, 4096));
    const tunnel = new Guac.WebSocketTunnel("/api/targets/" + t.id + v.tunnel);
    const client = new Guac.Client(tunnel);
    const display = client.getDisplay();
    view.appendChild(display.getElement());
    view.appendChild(buildWatermark(t.name));

    let closed = false;
    const teardown = (msg, isErr) => {
      if (closed) return; closed = true; rdpActive = false;
      try { client.disconnect(); } catch (e) {}
      wrap.remove(); // drops the Keyboard/Mouse listeners bound to the overlay
      say(msg || (v.label + " SESSION TO " + String(t.name).toUpperCase() + " CLOSED."), !!isErr);
      render(); focusPrimary();
    };

    const mouse = new Guac.Mouse(view);
    mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = (state) => client.sendMouseState(state);
    const keyboard = new Guac.Keyboard(wrap);
    keyboard.onkeydown = (sym) => {
      // Ctrl+Alt+Q (q = keysym 0x071 / Q = 0x051) disconnects; return without
      // forwarding so the chord is never sent to the privileged remote session.
      if (keyboard.modifiers.ctrl && keyboard.modifiers.alt && (sym === 0x071 || sym === 0x051)) {
        teardown();
        return true;
      }
      client.sendKeyEvent(1, sym);
    };
    keyboard.onkeyup = (sym) => client.sendKeyEvent(0, sym);

    const errMsg = (st, what) => "CPF9999: " + what + " — " + String((st && st.message) || "error").toUpperCase();
    client.onerror = (st) => teardown(errMsg(st, v.label), true);
    tunnel.onerror = (st) => teardown(errMsg(st, v.label + " TUNNEL"), true);
    client.onstatechange = (state) => { if (state === 5) teardown(); };       // 5 = client DISCONNECTED
    tunnel.onstatechange = (state) => { if (state === 2) teardown(); };        // 2 = tunnel CLOSED (e.g. admin kill / clean server close)

    client.connect("token=" + encodeURIComponent(tok) + "&width=" + w + "&height=" + h);
  }

      // Menu 26 — agent keys. Phase 159 gives a key a LIFECYCLE rather than just
      // an on/off existence: it may carry an expiry, it records its last use,
      // and it can be suspended (a pause the owner can undo) as well as revoked
      // (permanent, the token is gone). A key past its expires_at is already
      // dead server-side, so it is shown as `expired` — the row explains itself
      // instead of looking active.
      agents() {
        back = "main";
        const nowMs = Date.now();
        const expired = (a) => !!a.expires_at && Date.parse(a.expires_at) <= nowMs;
        // Three fixed-width markers, so the status column cannot widen with data.
        const status = (a) => a.disabled ? '<span class="red">suspended</span>'
          : expired(a) ? '<span class="red">expired  </span>'
          : '<span class="green">active   </span>';
        // Four timestamps on one 5250 row would run past the 980px terminal, so
        // Created is shown day-precision (its clock time carries nothing here)
        // and so, from Phase 167, is Expires: an expiry is MINTED in whole days
        // on PAMADDAGT, so its clock time was never a fact an operator chose.
        // Last used keeps its minutes, because staleness is read in hours. Both
        // are fmtTime's output, sliced — never a second date format.
        const day = (t) => pad(fmtTime(t).slice(0, 10), 10);
        const mins = (t) => pad(fmtTime(t).slice(0, 16), 16);
        // Phase 167 — the cumulative DAILY call budget. Two facts have to be
        // readable at a glance in one fixed-width cell: how close this agent is
        // to its cap, and whether that cap is ITS OWN or merely the server
        // default it happens to inherit. The fraction carries the first; square
        // brackets around the limit carry the second — [500] reads as "not this
        // agent's number, the server's" — so a deliberate cap can be told from an
        // unconfigured one without opening a second screen.
        //
        // The distinction is not cosmetic, because ZERO means opposite things on
        // the two sides of it. An agent with NO budget_per_day of its own and an
        // effective limit of 0 is inheriting a server default of "no limit"; an
        // agent whose OWN budget_per_day is 0 is a deliberate hard stop that may
        // make no calls at all. Collapsing them would render the strictest
        // setting in the feature as the most permissive one, so they are never
        // computed from the same number: `[∞]` (bracketed, cyan) can only ever be
        // the inherited one, and `/0` + STOP (red) can only ever be the explicit
        // one. FULL is the third red case — a real cap that today has spent.
        const ownBudget = (a) => a.budget_per_day !== undefined && a.budget_per_day !== null;
        const budgetCell = (a) => {
          const own = ownBudget(a), used = Number(a.budget_used_today || 0);
          const lim = Number((own ? a.budget_per_day : a.budget_limit_effective) || 0);
          const blocked = own && lim === 0;          // its own cap of zero: no calls at all
          const unlimited = !own && lim === 0;       // inheriting a server default of "no limit"
          const shown = unlimited ? "∞" : String(lim);
          const full = !blocked && lim > 0 && used >= lim;
          const mark = blocked ? "STOP" : full ? "FULL" : "";
          // cell() truncates, so a pathological counter cannot widen the row. The
          // fraction gives up one column when a marker follows it, spending it on
          // the separating space — so the marker always starts at the SAME offset
          // whether or not the row above it has one, and the cell is 15 wide
          // either way. A marker word that drifts left and right down the column
          // is a marker nobody scans. Eleven columns is what an exhausted
          // INHERITED cap needs at four digits (1000/[1000]), which is the widest
          // shape this cell takes in practice; the Owner column paid for it.
          // Amber from four fifths spent is the "about to run out" cue that
          // comes before either red one.
          const frac = used + "/" + (own ? shown : "[" + shown + "]");
          const tone = blocked || full ? "red" : unlimited ? "cyan" : used >= lim * 0.8 ? "amber" : "green";
          return `<td class="${tone}">${mark ? cell(frac, 10) + " " : cell(frac, 11)}${pad(mark, 4)}</td>`;
        };
        term.innerHTML = `${head("PAMWRKAGT", "Work with AI-Agent Keys")}
Non-human identities for the access broker: an agent may only request brokered tool
calls — never a credential. Every call is attributed to its accountable owner.
Budget is today's brokered calls against the daily cap. <span class="white">430/500</span> is the agent's OWN cap;
<span class="white">430/[500]</span> in brackets is the server default it inherits; <span class="cyan">12/[∞]</span> is that default set to no
limit. <span class="red">FULL</span> means a real cap is spent for today; <span class="red">3/0 STOP</span> is an agent capped at zero — it
is BLOCKED from every brokered call, which is the opposite of ∞, never the same thing.
Type options, press Enter.  <span class="cyan">4=Revoke (permanent)   5=Suspend   6=Resume   7=Budget   8=What can it reach</span>

<form id="f-list"><table>
<tr><th>Opt</th><th>ID</th><th>Name</th><th>Owner</th><th>Status</th><th>Budget</th><th>Created</th><th>Expires</th><th>Last used</th></tr>
${agents.map((a) => `<tr><td>${opt(a.id)}</td><td>${esc(a.id)}</td><td class="white">${cell(a.name, 13)}</td><td class="${a.owner_known === false ? "red" : ""}">${cell((a.owner || "-") + (a.owner_known === false ? " ?" : ""), 11)}</td><td>${status(a)}</td>${budgetCell(a)}<td class="cyan">${day(a.created_at)}</td><td class="${a.expires_at ? (expired(a) ? "red" : "amber") : "cyan"}">${day(a.expires_at || "never")}</td><td class="cyan">${mins(a.last_used_at || "never used")}</td></tr>`).join("")}
</table>${agents.length ? "" : `<div class="cyan indent">(No agent keys. Press F6 to mint one — requires the broker to be enabled.)</div>`}
<input type="submit" hidden></form>
<div class="cyan">An owner shown in red with a <span class="red">?</span> matches no pamv1 user, so deleting that human will
never suspend this agent — usually a typo. Fix it by re-minting under the right owner.
Suspend is reversible (5/6); revoke is not. An agent that presents a SPIFFE SVID has no key row
here at all — stop that one with F7=Quarantine list, and record who owns it with F8=SPIFFE owners
(without an owner its parked calls cannot be approved). Parked calls awaiting a human are on menu 20.
Option 7 sets or clears the daily budget: a rate limit bounds a burst, a budget bounds the day.</div>
${fkeys("F3=Exit   F5=Refresh   F6=Mint agent key   F7=Quarantine list   F8=SPIFFE owners   F12=Cancel")}`;
        document.getElementById("f-list").onsubmit = async (ev) => {
          ev.preventDefault();
          try {
            for (const a of agents) {
              const o = optVal(ev.target, a.id);
              if (o === "4") { await api("DELETE", `/v1/agents/${a.id}`); say(`AGENT ${String(a.name).toUpperCase()} REVOKED.`); }
              else if (o === "5") { await api("POST", `/v1/agents/${a.id}/disable`, {}); say(`AGENT ${String(a.name).toUpperCase()} SUSPENDED — ITS TOKEN STOPS RESOLVING UNTIL RESUMED.`); }
              else if (o === "6") { await api("POST", `/v1/agents/${a.id}/enable`, {}); say(`AGENT ${String(a.name).toUpperCase()} RESUMED.`); }
              // 7 is a prompt, not a verb: it carries the row to PAMAGTBGT and
              // stops reading the subfile, the same way 2=Change does elsewhere.
              else if (o === "7") { budgetAgent = a; return go("agentbudget"); }
              // 8 is the same kind of prompt: what this agent stands to reach,
              // which is the question its owner has to answer at review time.
              else if (o === "8") { return openReach(a.name, "agent"); }
              else if (o) { say("CPF0002: OPTION " + o.toUpperCase() + " NOT VALID.", true); }
            }
            await openAgents();
          } catch (e) { say("CPF9999: " + e.message, true); render(); }
        };
      },

      // Phase 167 — option 7 on PAMWRKAGT: an agent identity's cumulative DAILY
      // budget of brokered tool calls. Until now the only volume control was an
      // opt-in per-minute rate limit, which bounds a burst and not a day: an
      // agent capped at 60 calls a minute can still make 86,400 privileged calls
      // before the day rolls over, and nobody ever chose that number. This screen
      // is where somebody chooses it.
      //
      // Blank is a real answer here rather than an unfilled field: it CLEARS the
      // per-agent cap so the agent rides the server default again. That is the
      // one thing on this screen an operator could not guess, so the prompt says
      // it in words — and there is deliberately no separate "delete budget"
      // option to get out of step with it.
      //
      // Blank is also NOT the same as 0. An explicit 0 is this agent's own cap of
      // zero: a hard stop that admits no brokered call at all. The two are
      // opposites — blank is the most permissive answer on the screen and 0 the
      // strictest — so the prompt says that too, in red, rather than leaving an
      // operator to discover which one an empty-looking field meant.
      agentbudget() {
        back = "agents";
        const a = budgetAgent || {};
        const own = a.budget_per_day !== undefined && a.budget_per_day !== null;
        const eff = Number((own ? a.budget_per_day : a.budget_limit_effective) || 0);
        // Zero read two ways: its own zero is a block, an inherited zero is no
        // limit. The screen must never let one be mistaken for the other.
        const blocked = own && eff === 0;
        const unlimited = !own && eff === 0;
        // When the agent has no cap of its own, the limit in force IS the server
        // default, so the prompt can name the number blank would fall back to.
        const fallback = own ? "the server default" :
          `the server default (currently ${unlimited ? "unlimited" : esc(eff) + " calls/day"})`;
        term.innerHTML = `${head("PAMAGTBGT", "Set Agent Daily Budget")}
A daily ceiling on the brokered tool calls this agent may make. It counts every call the
broker admits, resets when the day rolls over, and refuses the rest once the day is spent.

<div class="indent">
Agent . . . . . . . :  <span class="white">${esc(a.name)}</span> (id ${esc(a.id)})
Owner . . . . . . . :  <span class="white">${esc(a.owner || "-")}</span>
Used today  . . . . :  <span class="white">${esc(Number(a.budget_used_today || 0))}</span> call(s)
In force now  . . . :  ${blocked ? '<span class="red">0 — BLOCKED, no brokered calls at all</span>'
  : unlimited ? '<span class="cyan">unlimited</span>'
  : `<span class="white">${esc(eff)}</span> call(s)/day`}   <span class="${own ? "white" : "cyan"}">${own ? "(this agent's own cap)" : "(inherited — the server default)"}</span>
</div>

<form id="f-bgt" class="indent">
<label>Calls per day . . . :  <input name="budget_per_day" size="12" inputmode="numeric" value="${own ? esc(a.budget_per_day) : ""}" placeholder="blank = server default" autofocus></label>
<input type="submit" hidden>
</form>
<div class="cyan indent">Type a number to give this agent a cap of its own.
<span class="white">Leave the field EMPTY and press Enter to CLEAR that cap</span> — the agent then goes back to
${fallback}.
Emptying the field is the only way to remove a per-agent budget — there is no separate
option for it, so an empty field here is an answer, not an unfilled one.
<span class="red">A cap of 0 is a BLOCK, not "no limit"</span> — the agent may then make no brokered call at all.
Blank is how you hand it back to the server default; 0 is how you stop it.</div>
${fkeys("F3=Exit   F12=Cancel")}`;
        document.getElementById("f-bgt").onsubmit = async (ev) => {
          ev.preventDefault();
          const raw = String(new FormData(ev.target).get("budget_per_day") || "").trim();
          // Empty must never fall through to Number("") === 0, because 0 is this
          // screen's HARDEST setting: it would block the agent outright where the
          // operator asked only to hand it back to the server default. The API
          // takes an explicit null for the clear, so that is what blank sends.
          const body = { budget_per_day: raw === "" ? null : Number(raw) };
          if (raw !== "" && !(Number.isInteger(body.budget_per_day) && body.budget_per_day >= 0)) {
            say("CPF0002: CALLS PER DAY MUST BE A WHOLE NUMBER 0 OR MORE (0 BLOCKS THE AGENT), OR BLANK FOR THE SERVER DEFAULT.", true);
            return render();
          }
          const name = String(a.name).toUpperCase();
          try {
            await api("POST", `/v1/agents/${a.id}/budget`, body);
            say(raw === "" ? `AGENT ${name} BUDGET CLEARED — IT NOW USES THE SERVER DEFAULT.`
              : body.budget_per_day === 0 ? `AGENT ${name} CAPPED AT 0 — IT IS BLOCKED FROM EVERY BROKERED CALL.`
              : `AGENT ${name} BUDGET SET TO ${body.budget_per_day} CALL(S)/DAY.`);
            await openAgents();
          } catch (e) { say("CPF9898: " + (e.status === 404 ? "AI-AGENT BROKER IS DISABLED (set PAM_BROKER_POLICY_FILE)." : e.message), true); render(); }
        };
      },

      // Menu 27 — the RFC 8693 token exchange (Phase 57), which shipped
      // curl-only. Read-only by nature: minting is an agent presenting its own
      // credential, so there is nothing here for a human to press.
      tokenexchange() {
        back = "main";
        const k = (tokenKeys && tokenKeys.keys && tokenKeys.keys[0]) || null;
        const off = !tokenKeys || tokenKeys.disabled;
        // A SPIFFE ID is `spiffe://<trust-domain>/<path>`, and every row on this
        // screen shares the same trust domain — so repeating it per cell spends
        // ~24 columns carrying no information, and a chain of two of them ran
        // off the 980px terminal, taking the reason column with it. The prefix is
        // shown once, above; the rows show paths.
        const shortID = (s) => String(s ?? "").replace(/^spiffe:\/\/[^/]+/, "");
        // The trust domain the ids below are relative to, taken from the first id
        // that has one. Every SVID this broker accepts is in one trust domain.
        let domain = "";
        for (const e of tokenEvents) {
          const m = /spiffe:\/\/([^/\s"]+)/.exec(e.detail || "");
          if (m) { domain = m[1]; break; }
        }
        const rows = tokenEvents.map((e) => {
          const f = detailFields(e.detail);
          const refused = e.action === "broker.token.refused";
          // The chain is delegator-outward (actor first); showing it as
          // actor>delegator>… is the direction accountability is read in.
          const chain = refused ? "-" : (f.chain || "-").split(">").map(shortID).join(">");
          const who = shortID(refused ? (f.delegator || e.actor) : (f.actor || "-"));
          return `<tr>
<td class="cyan">${fmtTime(e.ts)}</td>
<td>${refused ? '<span class="red">refused</span>' : "issued "}</td>
<td class="white">${cell(who, 22)}</td>
<td>${cell(chain, 34)}</td>
<td>${refused ? cell(f.reason || "-", 18) : cell((f.expires_in || "-") + "s", 18)}</td>
</tr>`;
        }).join("");
        term.innerHTML = `${head("PAMWRKTKX", "Delegated Agent Tokens (RFC 8693)")}
An agent delegates its OWN authority to a sub-agent and the broker signs a short-lived
JWT-SVID whose actor chain grows by exactly one link. Impersonation is refused: the
intermediary is always recorded, so every brokered call names the party accountable for it.

<div class="indent">Signing key . . . . :  ${off
  ? '<span class="red">TOKEN EXCHANGE IS DISABLED</span>  <span class="cyan">(set PAM_BROKER_TOKEN_EXCHANGE)</span>'
  : `<span class="white">${esc((k && k.kid) || "-")}</span>`}${off ? "" : `
Algorithm . . . . . :  ${esc((k && k.kty) || "-")} ${esc((k && k.crv) || "")} / ${esc((k && k.alg) || "-")}
Published at  . . . :  <span class="cyan">GET /v1/token/jwks</span>  (read_audit — the same gate as this screen)`}
</div>

Delegations, newest first. <span class="cyan">Minting is POST /v1/token, presented by the agent itself.</span>
${domain ? `<div class="indent cyan">Identities below are paths within the trust domain <span class="white">${esc(domain)}</span>; a refused row names the delegator that asked.</div>` : ""}
<table>
<tr><th>When</th><th>Result</th><th>Actor / delegator</th><th>Chain (actor&gt;delegator&gt;…)</th><th>TTL / reason</th></tr>
${rows}
</table>${tokenEvents.length ? "" : `<div class="cyan indent">(No delegation has been issued or refused in the last 500 audit events.)</div>`}
<div class="cyan">A minted token is stateless — the broker signs it and forgets it — so the audit
trail above is the only record that a delegation existed. It is bounded by the delegator's
own expiry, and its chain is capped by PAM_BROKER_MAX_DELEGATION_DEPTH.</div>
${fkeys("F3=Exit   F5=Refresh   F12=Cancel")}`;
      },

      // Phase 155 — one discrete, audited Kubernetes operation against a
      // kubernetes target: the same JIT-injected credential, command control,
      // transcript and audit row every other brokered command gets. Streaming
      // verbs (exec/attach/port-forward) are deliberately not offered.
      kubectl() {
        back = "targets";
        const t = kubeTarget || {};
        const r = kubeResult;
        term.innerHTML = `${head("PAMKUBECT", "Run Kubernetes Operation")}
Target <span class="white">${esc(t.name)}</span> (${esc(t.host)}:${esc(t.port)}) — the cluster's own RBAC decides what the
vaulted service-account token may do; pamv1 brokers, guards and records the call.

<form id="f-kube" class="indent">
<label>Verb  . . . . . . . :  <select name="verb"><option>get</option><option>logs</option><option>apply</option><option>delete</option></select>   <span class="cyan">exec/attach/port-forward are not brokered</span></label>
<label>API version . . . . :  <input name="api_version" size="20" value="v1" autofocus>   <span class="cyan">v1, apps/v1, example.com/v1alpha1</span></label>
<label>Resource  . . . . . :  <input name="resource" size="20" value="pods">   <span class="cyan">lowercase plural</span></label>
<label>Name  . . . . . . . :  <input name="name" size="30">   <span class="cyan">blank lists the collection (get)</span></label>
<label>Namespace . . . . . :  <input name="namespace" size="20">   <span class="cyan">blank = across all namespaces</span></label>
<label>Selector (get)  . . :  <input name="selector" size="30"></label>
<label>Container (logs)  . :  <input name="container" size="20"></label>
<label>Tail lines (logs) . :  <input name="tail_lines" size="6" value="200"></label>
<label>Manifest (apply)  . :  <textarea name="manifest" rows="4" cols="60"></textarea></label>
<input type="submit" hidden>
</form>
${kubeErr ? `<div class="red indent">${esc(kubeErr)}</div>` : ""}
${r ? `<div class="indent">Command . . . . . . :  <span class="white">${esc(r.command)}</span>
Cluster status  . . :  <span class="${r.status >= 200 && r.status < 300 ? "green" : "red"}">${esc(r.status)}</span>   <span class="cyan">${esc(r.method)} ${esc(r.path)}</span>
</div>
<div class="indent white" style="white-space:pre-wrap;max-height:20em;overflow:auto">${esc(r.body)}</div>` : ""}
${fkeys("F3=Exit   F12=Cancel")}`;
        document.getElementById("f-kube").onsubmit = async (ev) => {
          ev.preventDefault();
          const f = Object.fromEntries(new FormData(ev.target));
          f.tail_lines = Number(f.tail_lines) || 0;
          for (const k of Object.keys(f)) { if (f[k] === "") delete f[k]; }
          kubeErr = "";
          try { kubeResult = await api("POST", `/api/targets/${t.id}/kubectl`, f); }
          catch (e) { kubeResult = null; kubeErr = "CPF9899: " + e.message; }
          render();
        };
      },

      // Menu 28 — outbound-only endpoint agents (Phase 153): a target pamv1
      // cannot dial into runs pam-agent, which dials OUT and holds a reverse
      // tunnel; while an unrevoked agent exists the target is reached ONLY
      // through it. Status is this replica's live view.
      endpointagents() {
        back = "main";
        const canManage = can("manage_targets");
        const status = (a) => a.revoked_at ? '<span class="red">revoked  </span>' : a.connected ? '<span class="green">connected</span>' : '<span class="cyan">offline  </span>';
        term.innerHTML = `${head("PAMWRKEPA", "Work with Endpoint Agents")}
Outbound-only agents (pam-agent) for targets pamv1 cannot dial into: the agent dials OUT
to the SSH listener and holds a reverse tunnel; the target is then reached ONLY through it.
Type options, press Enter.  <span class="cyan">${canManage ? "4=Revoke (key stops resolving, live tunnel dropped)" : "(read-only role)"}</span>

<form id="f-list"><table>
<tr><th>Opt</th><th>ID</th><th>Name</th><th>Target</th><th>Status</th><th>Since / last seen</th><th>Remote</th></tr>
${endpointAgents.map((a) => `<tr><td>${canManage ? opt(a.id) : "  "}</td><td>${esc(a.id)}</td><td class="white">${cell(a.name, 16)}</td><td>${cell(a.target_name || a.target_id, 16)}</td><td>${status(a)}</td><td class="cyan">${fmtTime(a.connected_since || a.last_seen)}</td><td>${cell(a.remote || "-", 21)}</td></tr>`).join("")}
</table>${endpointAgents.length ? "" : `<div class="cyan indent">(No endpoint agents. Press F6 to register one for an SSH target — requires PAM_ENDPOINT_AGENTS_ENABLED.)</div>`}
<input type="submit" hidden></form>
<div class="cyan">Status is this replica's live view; in HA, point pam-agent at every replica (PAM_AGENT_SERVERS).</div>
${fkeys("F3=Exit   F5=Refresh" + (canManage ? "   F6=Register agent" : "") + "   F12=Cancel")}`;
        document.getElementById("f-list").onsubmit = async (ev) => {
          ev.preventDefault();
          try {
            for (const a of endpointAgents) {
              const o = optVal(ev.target, a.id);
              if (o === "4") { await api("DELETE", `/api/endpoint-agents/${a.id}`); say(`ENDPOINT AGENT ${String(a.name).toUpperCase()} REVOKED.`); }
              else if (o) { say("CPF0002: OPTION " + o.toUpperCase() + " NOT VALID.", true); }
            }
            await openEndpointAgents();
          } catch (e) { say("CPF9999: " + e.message, true); render(); }
        };
      },

      endpointagentadd() {
        back = "endpointagents";
        const sshTargets = (targets || []).filter((t) => (t.protocol || "ssh") === "ssh");
        term.innerHTML = `${head("PAMADDEPA", "Register Endpoint Agent")}
Binds an outbound-only agent to ONE SSH target (key shown once). From then on the target
is reached only through the agent — never dialed directly — until the agent is revoked.

<form id="f-add" class="indent">
<label>Agent name  . . . . :  <input name="name" size="20" required autofocus></label>
<label>Target  . . . . . . :  <select name="target_id" required>${sshTargets.map((t) => `<option value="${esc(t.id)}">${esc(t.name)} (${esc(t.host)}:${esc(t.port)})</option>`).join("")}</select></label>
<input type="submit" hidden>
</form>
${sshTargets.length ? "" : `<div class="red indent">No SSH targets to bind. Create the target first (menu 1) — its host:port is the address AS SEEN FROM THE ENDPOINT, e.g. 127.0.0.1:22.</div>`}
${fkeys("F3=Exit   F12=Cancel")}`;
        document.getElementById("f-add").onsubmit = async (ev) => {
          ev.preventDefault();
          const f = Object.fromEntries(new FormData(ev.target));
          f.target_id = Number(f.target_id);
          try { newEndpointAgent = await api("POST", "/api/endpoint-agents", f); go("endpointagentcreated"); }
          catch (e) { say("CPF9898: " + (e.status === 404 ? "ENDPOINT AGENTS ARE DISABLED (set PAM_ENDPOINT_AGENTS_ENABLED=true)." : e.message), true); render(); }
        };
      },

      endpointagentcreated() {
        back = "endpointagents";
        const a = newEndpointAgent || {};
        term.innerHTML = `${head("PAMEPAKEY", "Endpoint Agent Key")}
<span class="red blink">COPY THIS KEY NOW — IT IS SHOWN ONLY ONCE.</span>

<div class="indent">
Agent . . . . . . . :  <span class="white">${esc(a.name)}</span>
Target  . . . . . . :  <span class="white">${esc(a.target_name)}</span>
SSH login . . . . . :  <span class="white">${esc(a.login)}</span>

Agent key . . . . . :  <span class="white">${esc(a.key)}</span>
</div>
<div class="cyan indent">On the endpoint, run pam-agent with:
  PAM_AGENT_SERVERS=&lt;pam-host&gt;:2222   PAM_AGENT_NAME=${esc(a.name)}   PAM_AGENT_KEY=&lt;the key above&gt;
  PAM_AGENT_LOCAL_ADDR=127.0.0.1:22       PAM_AGENT_SERVER_HOST_KEY="$(ssh-keyscan -p 2222 &lt;pam-host&gt; | cut -d' ' -f2-)"
Only the key's hash is stored here.</div>
${fkeys("F3=Exit   F12=Cancel")}`;
      },

      agentadd() {
        back = "agents";
        term.innerHTML = `${head("PAMADDAGT", "Mint Agent Key")}
A bearer key for an AI agent (token shown once). Owner is the accountable human or
service recorded in every audit entry the agent produces.
<span class="cyan">Expiry is optional but recommended: an agent key that never expires outlives the task it was
minted for. Leave it blank for a key that never expires.</span>

<form id="f-add" class="indent">
<label>Agent name  . . . . :  <input name="name" size="20" required autofocus></label>
<label>Owner . . . . . . . :  <input name="owner" size="20" required></label>
<label>Expires in (days) . :  <input name="expires_in_days" size="6" inputmode="numeric" placeholder="never"></label>
<input type="submit" hidden>
</form>
${fkeys("F3=Exit   F12=Cancel")}`;
        document.getElementById("f-add").onsubmit = async (ev) => {
          ev.preventDefault();
          const f = Object.fromEntries(new FormData(ev.target));
          // Blank means "never expires", and the API reads that as the field
          // being absent — a "" would not survive its number decoding — so the
          // key is only sent, as a number, when the operator typed one.
          const days = String(f.expires_in_days || "").trim();
          if (days) f.expires_in_days = Number(days); else delete f.expires_in_days;
          if (days && !(Number.isFinite(f.expires_in_days) && f.expires_in_days > 0)) {
            say("CPF0002: EXPIRES IN (DAYS) MUST BE A POSITIVE NUMBER, OR BLANK FOR NEVER.", true); return render();
          }
          try { newAgent = await api("POST", "/v1/agents", f); go("agentcreated"); }
          catch (e) { say("CPF9898: " + (e.status === 404 ? "AI-AGENT BROKER IS DISABLED (set PAM_BROKER_POLICY_FILE)." : e.message), true); render(); }
        };
      },

      agentcreated() {
        back = "agents";
        const a = newAgent || {};
        term.innerHTML = `${head("PAMAGTTOK", "Agent Access Token")}
<span class="red blink">COPY THIS TOKEN NOW — IT IS SHOWN ONLY ONCE.</span>

<div class="indent">
Agent . . . . . . . :  <span class="white">${esc(a.name)}</span>
Owner . . . . . . . :  <span class="white">${esc(a.owner)}</span>

Access token  . . . :  <span class="white">${esc(a.token)}</span>
</div>
<div class="cyan indent">The agent presents it on /v1/tool-calls or /mcp; only its hash is stored.</div>
${fkeys("F3=Exit   F12=Cancel")}`;
      },

      // Phase 159 — the quarantine list. Entries are keyed by the agent's
      // CANONICAL SUBJECT: the agent-key NAME for a static key, and the FULL
      // SPIFFE ID (spiffe://trust-domain/path) for an agent that authenticates
      // with an SVID. That distinction is the whole point of this screen: an
      // SVID agent has no key row on PAMWRKAGT — its identity is minted by the
      // workload API, not by pamv1 — so there is nothing to revoke or suspend,
      // and quarantining its subject is the ONLY stop button it has. A
      // quarantined subject is refused at the door, before any tool call is
      // matched against policy.
      quarantine() {
        back = "agents";
        term.innerHTML = `${head("PAMAGTQAR", "Quarantine Agent Identities")}
A quarantined subject is refused at the broker door — before policy, before any tool call.
Subject is the agent-key NAME for a static key, or the FULL SPIFFE ID for an SVID agent
(an SVID agent has no key to revoke, so this is the only way to stop one).
Type options, press Enter.  <span class="cyan">4=Release (the subject may call again)</span>

<form id="f-list"><table>
<tr><th>Opt</th><th>ID</th><th>Subject</th><th>Reason</th><th>By</th><th>When</th></tr>
${quarantine.map((q) => `<tr><td>${opt(q.id)}</td><td>${esc(q.id)}</td><td class="white">${cell(q.subject, 32)}</td><td class="amber">${cell(q.reason || "-", 20)}</td><td>${cell(q.created_by || "-", 10)}</td><td class="cyan">${fmtTime(q.created_at)}</td></tr>`).join("")}
</table>${quarantine.length ? "" : `<div class="cyan indent">(Nothing quarantined. Press F6 to stop an identity — it takes effect on its next call.)</div>`}
<input type="submit" hidden></form>
<div class="cyan">Quarantine is a containment switch, not a lifecycle change: a static key stays minted (suspend it
on PAMWRKAGT to pause the key), and an SVID keeps being issued — it just stops being served here.</div>
${fkeys("F3=Exit   F5=Refresh   F6=Quarantine an identity   F12=Cancel")}`;
        document.getElementById("f-list").onsubmit = async (ev) => {
          ev.preventDefault();
          try {

    render();
  }

  const adders = { targets: () => go("targetadd"), creds: () => go("credadd"), grants: () => go("grantadd"), users: () => go("useradd"), requests: () => go("requestadd"), profiles: () => go("profileadd"), config: () => go("configset"), apps: () => go("appadd"), appgrants: () => go("appgrantadd"), safes: () => go("safeadd"), safemembers: () => go("safememberadd"), campaigns: openCampaignAdd, vendors: () => go("vendoradd"), vendorgrants: () => go("vendorgrantadd"), agents: () => go("agentadd"), quarantine: () => go("quarantineadd"), identities: () => go("identityadd"), scimkeys: () => go("scimkeyadd"), exttoken: mintExtToken, endpointagents: () => { if (can("manage_targets")) go("endpointagentadd"); }, deps: () => go("depadd"), sesswatch: () => { shareInviteSid = watchSess && watchSess.id; go("shareinvitenew"); }, mfawebauthn: () => go("mfawebauthnadd") };

  window.addEventListener("keydown", async (ev) => {
    // While the RDP viewer is open it owns the keyboard (its own capture-phase
    // listener handles the Ctrl+Alt+Q disconnect); leave portal navigation inert.
    if (rdpActive) return;
    const k = ev.key;
    // Theme cycling (Phase 126) works everywhere, including sign-on — it is a
    // cosmetic preference, not a screen action, so it does not belong behind
    // the "screen === signon" gate every other F-key sits behind below.
    if (k === "F2") { ev.preventDefault(); cycleTheme(); return; }
    // Arrow keys move between subfile option cells (5250-style row navigation), so
    // a whole list of rows is operable without the mouse.
    if ((k === "ArrowDown" || k === "ArrowUp") && ev.target.classList && ev.target.classList.contains("opt")) {
      const opts = [...term.querySelectorAll("input.opt")];
      const i = opts.indexOf(ev.target);
      if (i >= 0) {
        ev.preventDefault();
        const next = opts[k === "ArrowDown" ? i + 1 : i - 1];
        if (next) next.focus();
      }
      return;
    }
    // Replay player controls (Phase 26): Space pauses/resumes, F5 restarts,
    // F6 cycles the speed — all without leaving the keyboard.
    if (screen === "recplay" && k === " ") { ev.preventDefault(); replayToggle(); return; }
    if (screen === "recplay" && (k === "F5" || k === "F6")) {
      ev.preventDefault();
      if (k === "F5") replayRestart(); else replayCycleSpeed();
      return;
    }
    // Esc cancels / goes back (the keyboard twin of F12), except at sign-on/main.
    if (k === "Escape") {
      if (screen === "signon" || screen === "main") return;
      ev.preventDefault();
      go(back);
      return;
    }
    if (!["F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F12"].includes(k)) return;
    ev.preventDefault();
    if (screen === "signon") return;
    try {
      if (k === "F3") { screen === "main" ? signoff() : go("main"); }
      else if (k === "F4") { if (screen === "recordings") openRecSearch(); }
      else if (k === "F5") { const r = refreshers[screen]; if (r) await r(); else render(); }
      else if (k === "F6") { if (screen === "effective") await exportIaC("env"); else if (screen === "audit") await verifyChain(); else { const a = adders[screen]; if (a) a(); } }
      else if (k === "F7") { if (screen === "effective") await exportIaC("helm"); else if (screen === "agents") await openQuarantine(); else if (screen === "audit") await fetchAuditHead(); else if (screen === "campaigns" && can("approve")) await openMyQueue(); else if (screen === "sesswatch" && watchSess) await openShareInvites(watchSess.id); }
      else if (k === "F8") { if (screen === "effective") await exportIaC("terraform"); else if (screen === "audit") await openNIS2Report(); else if (screen === "agents") await openIdentities(); else if (screen === "sesswatch" && watchSess && can("approve")) await toggleSuspend(); }
      else if (k === "F9") { if (screen === "audit") await exportAudit(); else if (screen === "users") await reconcileIdentities(); else if (screen === "sshcerts") await download("/api/ca/ssh/krl", "pamv1-revoked-certs.krl", "KRL"); else if (screen === "nis2report") await download("/api/compliance/nis2" + (nis2Query() ? "?" + nis2Query() : ""), "pamv1-nis2-report.json", "NIS2 REPORT"); }
      else if (k === "F10") { if (screen === "audit") await download("/api/audit/ocsf", "pamv1-audit-ocsf.json", "OCSF"); }
      else if (k === "F12") { go(back); }
    } catch (e) { say("CPF9999: " + e.message, true); render(); }
  });

  setInterval(() => { const el = term.querySelector(".row .cyan"); if (el && screen !== "audit") el.textContent = now(); }, 1000);
  if (apiKey) { loadMe().then(render).catch(() => { apiKey = ""; me = null; screen = "signon"; render(); }); } else render();
})();
</script>
</body>
