<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAMV1 — Privileged Access Management</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #050705; color: #2eff7b;
    font: 16px/1.35 "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    text-shadow: 0 0 5px rgba(46, 255, 123, .35);
    display: flex; justify-content: center;
  }
  body::after { /* CRT scanlines */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }
  #term { width: 100%; max-width: 980px; padding: 12px 16px; white-space: pre-wrap; }
  a, .green { color: #2eff7b; }
  .white { color: #eaffea; text-shadow: 0 0 5px rgba(234,255,234,.35); }
  .cyan  { color: #4be0e0; text-shadow: 0 0 5px rgba(75,224,224,.35); }
  .red   { color: #ff4d4d; text-shadow: 0 0 5px rgba(255,77,77,.45); }
  .amber { color: #ffcf55; text-shadow: 0 0 5px rgba(255,207,85,.4); }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .row { display: flex; justify-content: space-between; }
  hr { border: 0; border-top: 1px solid #123c1f; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 1px 8px 1px 0; font-weight: normal; white-space: nowrap; }
  th { color: #eaffea; }
  td.detail { white-space: normal; }
  input, select {
    font: inherit; color: #2eff7b; background: #041407;
    border: 0; border-bottom: 1px solid #2eff7b; outline: none; padding: 0 2px;
    text-shadow: inherit; caret-color: #2eff7b;
  }
  select { border: 1px solid #123c1f; }
  input:focus, select:focus, a:focus { background: #0a2a12; outline: 1px solid #4be0e0; }
  input.opt { width: 3ch; text-align: center; text-transform: uppercase; }
  input[type=checkbox] { width: auto; }
  .fkeys { color: #4be0e0; margin-top: 8px; }
  .khint { color: #2f7d4a; margin-top: 2px; font-size: 0.9em; }
  .msg { min-height: 1.3em; color: #eaffea; }
  .msg.err { color: #ff4d4d; }
  form.inline { display: inline; }
  label { display: block; }
  .indent { margin-left: 4ch; }
  /* Live session watch pane (Phase 16 monitoring viewer). */
  .watchpane { height: 55vh; overflow-y: auto; background: #020402;
    border: 1px solid #123c1f; padding: 4px 6px; white-space: pre-wrap;
    word-break: break-all; margin: 4px 0; }
  /* In-portal graphical viewer overlay, RDP and VNC alike (Guacamole canvas).
     The rdp* class names predate VNC; both viewers share this one overlay. */
  .rdpwrap { position: fixed; inset: 0; z-index: 50; background: #050705;
    display: flex; flex-direction: column; }
  .rdpbar { flex: 0 0 auto; padding: 4px 12px; border-bottom: 1px solid #123c1f;
    display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
  .rdpview { flex: 1 1 auto; overflow: auto; display: flex;
    justify-content: center; align-items: flex-start; background: #000; }
  .rdpview canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="term"></div>
<script nonce="__CSP_NONCE__">
(() => {
  const term = document.getElementById("term");
  let apiKey = sessionStorage.getItem("pam_api_key") || "";
  let me = null; // { name, role, break_glass, capabilities:[] }

  // Pick up a token/error handed back by the OIDC callback in the URL fragment.
  let ssoMsg = "", ssoErr = false;
  if (location.hash.length > 1) {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("pam_token")) { apiKey = h.get("pam_token"); sessionStorage.setItem("pam_api_key", apiKey); ssoMsg = "SINGLE SIGN-ON COMPLETE."; }
    else if (h.get("pam_error")) { ssoMsg = "SSO FAILED: " + h.get("pam_error").toUpperCase(); ssoErr = true; }
    history.replaceState(null, "", location.pathname + location.search);
  }

  let screen = apiKey ? "main" : "signon";
  let back = "main";
  let msg = ssoMsg, msgErr = ssoErr;
  // Per-screen data.
  let targets = [], creds = [], audit = [], sessions = [], requests = [], checkouts = [], users = [], grants = [];
  let apps = [], appGrants = [], grantsApp = 0, newApp = null;
  let viewCred = null, grantsTarget = 0, newUser = null, mfaInfo = null, mfaEnroll = null, recoveryCodes = [], discovered = null, reconcileReport = null;
  let profiles = [], configItems = [], configNote = "", effCfg = null, iacText = "", iacFormat = "";
  let safes = [], safeMembers = [], membersSafe = 0, safeTarget = null;
  let editTarget = null, editSafe = null, editUser = null; // 2=Change subjects (Phase 44)
  // Phase 45: the remaining console screens.
  let vendors = [], vendorGrants = [], grantsVendor = 0, newVendor = null, editVendor = null;
  let sshCerts = [], caInfo = null, loginSessions = [], agents = [], newAgent = null;
  let deps = [], depsCred = null, blastResult = null, auditHead = null;
  let campaigns = [], campView = null, risk = null, riskMin = "", riskWin = "";
  let brokerApprovals = [], stepUps = [];
  let watchSess = null, watchAbort = null, watchText = "";
  let liveTimer = null;
  let recordings = [], replay = null; // replay = one loaded recording + player state

  // The Apache Guacamole client (vendored) powers the in-portal RDP viewer. It is
  // imported on demand — the first time an operator opens RDP — so the ~75KB module
  // never loads for the sign-on screen, non-RDP roles, or guacd-disabled deploys.
  // GUAC_SRC is a content-addressed path (…?v=<hash>) so an upgrade busts the cache.
  const GUAC_SRC = "__GUAC_SRC__";
  let rdpActive = false, guacPromise = null; // rdpActive: a graphical viewer (RDP or VNC) owns the keyboard
  function loadGuac() {
    // Memoize the resolved module, but reset on failure so a transient error retries.
    if (!guacPromise) {
      guacPromise = import(GUAC_SRC).then((m) => m.default)
        .catch((e) => { guacPromise = null; throw e; });
    }
    return guacPromise;
  }

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (s, n) => esc(String(s ?? "")).padEnd(n);
  const can = (c) => !!(me && me.capabilities && me.capabilities.includes(c));
  const fmtTime = (t) => t ? esc(String(t).replace("T", " ").slice(0, 19)) : "-";
  const now = () => { const d = new Date(), z = (x) => String(x).padStart(2, "0");
    return `${z(d.getDate())}/${z(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}  ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { "X-API-Key": apiKey, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error((data.error || res.statusText).toUpperCase());
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // apiAll drains a cursor-paged list endpoint (Phase 44): the API caps every
  // page at 500 rows, so follow the ?after= cursor until a short page comes
  // back. Keeps the subfiles complete while each request stays bounded.
  async function apiAll(path) {
    const sep = path.includes("?") ? "&" : "?";
    let out = [], after = 0;
    for (;;) {
      const page = await api("GET", `${path}${sep}limit=500&after=${after}`);
      out = out.concat(page);
      if (!Array.isArray(page) || page.length < 500) return out;
      after = page[page.length - 1].id;
    }
  }

  // loadMe resolves the caller's identity + capabilities so the menu shows only
  // the options the role may use. Panels still tolerate a 403 as a backstop.
  async function loadMe() { me = await api("GET", "/api/me"); }

  const say = (t, err) => { msg = t; msgErr = !!err; };
  function stopLive() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

  function head(id, title) {
    return `<div class="row"><span class="white">${id}</span><span>${title}</span><span class="white">SYSTEM: PAMV1</span></div>` +
           `<div class="row"><span>${me ? esc(me.name) + " / " + esc(me.role) + (me.break_glass ? " (BREAK-GLASS)" : "") : ""}</span><span class="cyan">${now()}</span></div><hr>`;
  }
  const fkeys = (t) => `<hr><div class="fkeys">${t}</div>` +
    `<div class="khint">Enter=Confirm&nbsp;&nbsp;Esc=Back&nbsp;&nbsp;Tab / ↑↓=Move&nbsp;&nbsp;(the mouse is optional)</div>` +
    `<div class="msg${msgErr ? " err" : ""}">${esc(msg)}</div>`;

  // opt renders a subfile option input; optCell reads the typed option for a row.
  const opt = (id) => `<input class="opt" name="o${esc(id)}" maxlength="1">`;
  const optVal = (form, id) => (form["o" + id]?.value || "").trim();

  // --- async openers: fetch the screen's data, then render it. Also used by F5. ---
  async function openTargets() { try { [targets, safes] = await Promise.all([apiAll("/api/targets"), apiAll("/api/safes").catch(() => safes)]); } catch (e) { targets = []; } go("targets"); }
  async function openCreds() { try { [targets, creds] = await Promise.all([apiAll("/api/targets").catch(() => []), apiAll("/api/credentials")]); } catch (e) { creds = []; } go("creds"); }
  async function openSessions() { try { sessions = await api("GET", "/api/sessions"); } catch (e) { sessions = []; } go("sessions"); }
  async function openCheckouts() { try { [targets, checkouts] = await Promise.all([apiAll("/api/targets").catch(() => []), apiAll("/api/checkouts?active=true")]); } catch (e) { checkouts = []; } go("checkouts"); }
  async function openUsers() { try { [users, profiles] = await Promise.all([apiAll("/api/users"), api("GET", "/api/profiles").catch(() => [])]); } catch (e) { users = []; } go("users"); }
  async function openProfiles() { try { profiles = await api("GET", "/api/profiles"); } catch (e) { profiles = []; } go("profiles"); }
  async function openConfig() { try { const r = await api("GET", "/api/config"); configItems = r.settings || []; configNote = r.note || ""; } catch (e) { configItems = []; } go("config"); }
  async function openEffective() { try { effCfg = await api("GET", "/api/config/effective"); } catch (e) { effCfg = null; } go("effective"); }
  async function openMfa() { try { mfaInfo = await api("GET", "/api/mfa"); } catch (e) { mfaInfo = { enrolled: false, confirmed: false }; } go("mfa"); }
  async function openAudit() { try { audit = await api("GET", "/api/audit?limit=100"); } catch (e) { audit = []; } go("audit"); }
  async function openReconcile() { reconcileReport = null; try { reconcileReport = await api("GET", "/api/reconcile"); } catch (e) {} go("reconcile"); }
  async function openGrants(tid) { grantsTarget = tid; try { grants = await api("GET", `/api/targets/${tid}/grants`); } catch (e) { grants = []; } go("grants"); }
  // Broker approvals (Phase 43): a parked agent tool call waits for a human. The
  // routes exist only when the broker is enabled, so a 404 shows a hint rather
  // than an error, matching the application-secrets screen.
  async function openBrokerApprovals() {
    brokerApprovals = [];
    try { brokerApprovals = await api("GET", "/v1/approvals"); }
    catch (e) { if (e.status === 404) say("AI-AGENT BROKER IS DISABLED (set PAM_BROKER_POLICY_FILE)."); }
    go("brokerapprovals");
  }
  // Step-ups (Phase 43): a paused statement is waiting on a supervisor and will
  // be refused when its TTL expires, so this screen is time-critical.
  async function openStepUps() {
    stepUps = [];
    try { stepUps = await api("GET", "/api/sessions/stepups"); } catch (e) {}
    go("stepups");
  }
  async function openRequests() {
    requests = [];
    if (can("approve")) { try { requests = await apiAll("/api/access-requests"); } catch (e) {} }
    if (targets.length === 0) { try { targets = await apiAll("/api/targets"); } catch (e) {} }
    go("requests");
  }
  // Application-secrets console (Phase 24). The routes exist only when the API is
  // enabled (PAM_APP_SECRETS_ENABLED); a 404 shows a helpful hint instead of an error.
  async function openApps() {
    apps = [];
    try { apps = await api("GET", "/v1/apps"); }
    catch (e) { if (e.status === 404) say("APPLICATION-SECRETS API IS DISABLED (set PAM_APP_SECRETS_ENABLED)."); }
    go("apps");
  }
  async function openAppGrants(aid) {
    grantsApp = aid; appGrants = [];
    try {
      [creds, appGrants] = await Promise.all([
        apiAll("/api/credentials").catch(() => creds),
        api("GET", `/v1/apps/${aid}/grants`),
      ]);
      if (targets.length === 0) { try { targets = await apiAll("/api/targets"); } catch (e) {} }
    } catch (e) { appGrants = []; }
    go("appgrants");
  }

  // Safes console (Phase 17). Targets are loaded alongside so the safe screens
  // can show how many targets each safe holds.
  async function openSafes() {
    try { [safes, targets] = await Promise.all([apiAll("/api/safes"), apiAll("/api/targets").catch(() => targets)]); }
    catch (e) { safes = []; }
    go("safes");
  }
  async function openSafeMembers(sid) {
    membersSafe = sid; safeMembers = [];
    try { safeMembers = await api("GET", `/api/safes/${sid}/members`); } catch (e) {}
    go("safemembers");
  }
  // openTargetSafe opens the assign-target-to-safe screen, making sure the safe
  // list is loaded for the picker.
  async function openTargetSafe(t) {
    safeTarget = t;
    if (safes.length === 0) { try { safes = await apiAll("/api/safes"); } catch (e) {} }
    go("targetsafe");
  }
  // Certification campaigns console (Phase 19).
  async function openCampaigns() { try { campaigns = await api("GET", "/api/campaigns"); } catch (e) { campaigns = []; } go("campaigns"); }
  async function openCampaign(id) {
    try { campView = await api("GET", `/api/campaigns/${id}`); } catch (e) { campView = null; }
    go("campitems");
  }
  // Risk dashboard (Phase 23). A 404 means the analytics engine is not wired in.
  async function openRisk() {
    risk = null;
    try {
      const q = [riskMin && "min_level=" + riskMin, riskWin && "window_min=" + encodeURIComponent(riskWin)].filter(Boolean).join("&");
      risk = await api("GET", "/api/analytics/risk" + (q ? "?" + q : ""));
    } catch (e) { if (e.status === 404) say("THREAT ANALYTICS IS NOT ENABLED."); }
    go("risk");
  }

  // --- Phase 45 openers: vendors, operator certificates, blast radius, login
  // sessions, agent keys, and a credential's dependent accounts. ---
  async function openVendors() {
    try { [vendors, targets] = await Promise.all([apiAll("/api/vendors"), apiAll("/api/targets").catch(() => targets)]); }
    catch (e) { vendors = []; }
    go("vendors");
  }
  async function openVendorGrants(vid) {
    grantsVendor = vid; vendorGrants = [];
    try { vendorGrants = await api("GET", `/api/vendors/${vid}/grants`); } catch (e) {}
    if (targets.length === 0) { try { targets = await apiAll("/api/targets"); } catch (e) {} }
    go("vendorgrants");
  }
  async function openSSHCerts() {
    sshCerts = []; caInfo = null;
    try { sshCerts = await api("GET", "/api/ca/ssh/certs"); } catch (e) {}
    // The CA key is separate state: certs list fine while ZSP is not enabled.
    try { caInfo = await api("GET", "/api/ca/ssh"); }
    catch (e) { if (e.status === 404) caInfo = { disabled: true }; }
    go("sshcerts");
  }
  async function openLoginSessions() {
    try { loginSessions = await api("GET", "/api/login-sessions"); } catch (e) { loginSessions = []; }
    go("loginsessions");
  }
  // Agent keys (Phase 13): the routes exist only when the broker is enabled, so
  // a 404 shows a hint rather than an error — the app-secrets screen's pattern.
  async function openAgents() {
    agents = [];
    try { agents = await api("GET", "/v1/agents"); }
    catch (e) { if (e.status === 404) say("AI-AGENT BROKER IS DISABLED (set PAM_BROKER_POLICY_FILE)."); }
    go("agents");
  }
  async function openDeps(credID) {
    depsCred = creds.find((c) => c.id === credID) || { id: credID };
    deps = [];
    try { deps = await api("GET", `/api/credentials/${credID}/dependencies`); } catch (e) {}
    go("deps");
  }
  // verifyChain / fetchAuditHead surface the tamper-evidence controls on the
  // audit screen (Phase 45); both endpoints answer 501 with a config hint when
  // the chain / checkpoint signing is not enabled.
  async function verifyChain() {
    try {
      const r = await api("GET", "/api/audit/verify");
      say(r.ok ? "AUDIT CHAIN VERIFIED — INTACT." : "AUDIT CHAIN BROKEN AT EVENT " + r.broke_at_id + ".", !r.ok);
    } catch (e) { say("CPF9999: " + e.message, true); }
    render();
  }
  async function fetchAuditHead() {
    try { auditHead = await api("GET", "/api/audit/head"); go("auditheadview"); }
    catch (e) { say("CPF9999: " + e.message, true); render(); }
  }

  // download fetches an authenticated export and hands it to the browser as a
  // file, surfacing the digest header when the endpoint stamps one.
  async function download(path, filename, label) {
    const res = await fetch(path, { headers: { "X-API-Key": apiKey } });
    if (!res.ok) { say("CPF9999: EXPORT FAILED (" + res.status + ")", true); render(); return; }
    const digest = res.headers.get("X-PAM-Export-SHA256") || "";
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    say(label + " EXPORTED" + (digest ? " — SHA256 " + digest.slice(0, 16) + "…" : "."));
    render();
  }

  // stripCtl removes ANSI escape sequences and carriage returns from a live
  // terminal frame so the watch pane shows readable text, not control codes.
  const stripCtl = (t) => t.replace(/\x1b(?:\[[0-9;?]*[ -\/]*[@-~]|\][^\x07\x1b]*(?:\x07|\x1b\\)?|[@-Z\\-_])/g, "").replace(/\r/g, "");

  // appendWatch adds a live frame to the watch pane, keeping only the most
  // recent output bounded so a long session cannot grow the DOM without limit.
  function appendWatch(t) {
    watchText = (watchText + stripCtl(t)).slice(-65536);
    const pane = document.getElementById("watch-pane");
    if (pane) { pane.textContent = watchText; pane.scrollTop = pane.scrollHeight; }
  }
  // stopWatch aborts the SSE stream and clears the viewer state; go() calls it
  // whenever navigation leaves the watch screen.
  function stopWatch() {
    if (watchAbort) { watchAbort.abort(); watchAbort = null; }
    watchSess = null; watchText = "";
  }

  // watchSession opens the live monitor for a session (Phase 16): it reads the
  // GET /api/sessions/{id}/stream SSE endpoint with fetch — EventSource cannot
  // send the X-API-Key header — and renders each output frame into the pane.
  // The watch is view-only and is itself audited server-side (session.monitor).
  async function watchSession(s) {
    stopWatch();
    watchSess = s;
    go("sesswatch");
    const ctrl = new AbortController();
    watchAbort = ctrl;
    try {
      const res = await fetch(`/api/sessions/${s.id}/stream`, { headers: { "X-API-Key": apiKey }, signal: ctrl.signal });
      if (!res.ok) throw new Error("STREAM UNAVAILABLE (" + res.status + ")");
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, i); buf = buf.slice(i + 2);
          for (const line of ev.split("\n")) {
            // The server escapes BOTH line terminators (sseEscape: CR -> \r,
            // LF -> \n — either would end the SSE data field). Undo both; the
            // restored real CRs are then dropped by stripCtl, so terminal
            // CRLF output renders as clean lines instead of trailing "\r"
            // literals on every watched line.
            if (line.startsWith("data: ")) appendWatch(line.slice(6).replaceAll("\\r", "\r").replaceAll("\\n", "\n"));
          }
        }
      }
      if (screen === "sesswatch" && !ctrl.signal.aborted) { say("SESSION ENDED — STREAM CLOSED."); render(); }
    } catch (e) {
      if (screen === "sesswatch" && !ctrl.signal.aborted) { say("CPF9999: " + String(e.message || e).toUpperCase(), true); render(); }
    }
  }

  // --- session-recording replay (Phase 26) ---

  // openRecordings loads the stored-recordings listing (auditor view of what
  // the proxies recorded to disk).
  async function openRecordings() { try { recordings = await api("GET", "/api/recordings"); } catch (e) { recordings = []; } go("recordings"); }

  // openReplay fetches one recording (raw asciicast or transcript — api() JSON
  // helper does not fit) plus the server's tamper-evidence headers: the
  // recomputed SHA-256 and whether that hash appears in the audit trail.
  async function openReplay(rec) {
    const res = await fetch(`/api/recordings/${encodeURIComponent(rec.name)}`, { headers: { "X-API-Key": apiKey } });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error((d.error || res.statusText).toUpperCase()); }
    const body = await res.text();
    const frames = [];
    if (rec.kind === "asciicast") {
      // asciicast v2: one JSON value per line — a header object, then
      // [time, "o", data] output events (our recorders only write "o").
      for (const line of body.split("\n")) {
        if (!line.trim()) continue;
        try {
          const ev = JSON.parse(line);
          if (Array.isArray(ev) && ev[1] === "o") frames.push({ t: ev[0], text: String(ev[2]) });
        } catch (e) { /* skip an unparsable line rather than lose the replay */ }
      }
    } else {
      frames.push({ t: 0, text: body });
    }
    stopReplay();
    replay = {
      name: rec.name, kind: rec.kind, frames,
      total: frames.length ? frames[frames.length - 1].t : 0,
      sha: res.headers.get("X-PAM-Recording-SHA256") || "",
      audited: res.headers.get("X-PAM-Recording-Audited") === "true",
      i: 0, pos: 0, speed: 1, playing: false, timer: null, text: "",
    };
    go("recplay");
    replayPlay();
  }

  // stopReplay halts the player and drops its state; go() calls it whenever
  // navigation leaves the replay screen.
  function stopReplay() { if (replay) { clearTimeout(replay.timer); replay = null; } }

  // replayStatus repaints the player's status line and pane in place (no full
  // re-render per frame).
  function replayStatus() {
    if (!replay) return;
    const mmss = (s) => { const v = Math.max(0, Math.round(s)); return `${String(Math.floor(v / 60)).padStart(2, "0")}:${String(v % 60).padStart(2, "0")}`; };
    const st = document.getElementById("rp-status");
    if (st) st.textContent = `TIME ${mmss(replay.pos)} / ${mmss(replay.total)}   FRAME ${replay.i}/${replay.frames.length}   SPEED ${replay.speed === "MAX" ? "MAX" : replay.speed + "x"}   ${replay.playing ? "PLAYING" : replay.i >= replay.frames.length ? "END OF RECORDING" : "PAUSED"}`;
    const pane = document.getElementById("replay-pane");
    if (pane) { pane.textContent = replay.text; pane.scrollTop = pane.scrollHeight; }
  }

  // replayStep shows the next frame and schedules the one after it, compressing
  // long idle gaps (asciinema-style) so a quiet session replays briskly.
  function replayStep() {
    if (!replay || replay.i >= replay.frames.length) { if (replay) replay.playing = false; replayStatus(); return; }
    const f = replay.frames[replay.i++];
    replay.text = (replay.text + stripCtl(f.text)).slice(-65536);
    replay.pos = f.t;
    replayStatus();
    if (replay.i >= replay.frames.length) { replay.playing = false; replayStatus(); return; }
    if (replay.speed === "MAX") { replayStep(); return; }
    const gap = Math.min(Math.max(replay.frames[replay.i].t - f.t, 0), 2); // cap idle at 2s
    replay.timer = setTimeout(replayStep, (gap * 1000) / replay.speed);
  }

  // replayPlay / replayToggle / replayRestart / replayCycleSpeed are the
  // keyboard controls: Space pauses, F5 restarts, F6 cycles 1x→2x→4x→8x→MAX.
  function replayPlay() { if (!replay || replay.playing) return; if (replay.i >= replay.frames.length) return; replay.playing = true; replayStep(); }
  function replayToggle() {
    if (!replay) return;
    if (replay.playing) { clearTimeout(replay.timer); replay.playing = false; replayStatus(); }
    else replayPlay();
  }
  function replayRestart() {
    if (!replay) return;
    clearTimeout(replay.timer);
    replay.i = 0; replay.pos = 0; replay.text = ""; replay.playing = false;
    replayPlay();
  }
  function replayCycleSpeed() {
    if (!replay) return;
    const speeds = [1, 2, 4, 8, "MAX"];
    replay.speed = speeds[(speeds.indexOf(replay.speed) + 1) % speeds.length];
    if (replay.speed === "MAX" && replay.playing) { clearTimeout(replay.timer); replayStep(); }
    replayStatus();
  }

  const VIEWERS = {
    rdp: { label: "RDP", port: 3389, tokenPath: "/api/rdp-token", tunnel: "/rdp" },
    vnc: { label: "VNC", port: 5900, tokenPath: "/api/vnc-token", tunnel: "/vnc" },

  // openViewer mints a short-lived token, then launches the in-portal viewer for
  // an rdp- or vnc-protocol target. The credential is injected server-side at the
  // guacd handshake; the browser only ever receives the rendered display.
  async function openViewer(t) {
    const v = VIEWERS[t.protocol];
    if (!v) { say("CPF0002: TARGET " + String(t.name).toUpperCase() + " HAS NO IN-PORTAL VIEWER.", true); render(); return; }
    let Guac, tok;
    try {
      Guac = await loadGuac();
      tok = (await api("POST", v.tokenPath)).token;
    } catch (e) { say("CPF9999: " + String(e.message || (v.label + " VIEWER UNAVAILABLE")).toUpperCase(), true); render(); return; }
    startViewer(Guac, t, tok, v);
  }

  // startViewer builds the fullscreen viewer overlay, wires the Guacamole client to
  // the WebSocket tunnel, and forwards keyboard/mouse. Keyboard/Mouse are bound to
  // the overlay element (not document), so removing the overlay on teardown drops
  // every listener — guacamole-common-js has no detach API. Ctrl+Alt+Q disconnects
  // and is swallowed inside onkeydown so the chord never reaches the remote host.
  function startViewer(Guac, t, tok, v) {
    const wrap = document.createElement("div"); wrap.className = "rdpwrap"; wrap.tabIndex = -1;
    const bar = document.createElement("div"); bar.className = "rdpbar";
    bar.innerHTML = `<span><span class="white">${esc(v.label)}</span> ${esc(t.name)} <span class="cyan">${esc(t.host)}:${esc(t.port || v.port)}</span></span>` +
      `<span class="amber">Ctrl+Alt+Q = disconnect</span>`;
    const view = document.createElement("div"); view.className = "rdpview";
    wrap.appendChild(bar); wrap.appendChild(view); document.body.appendChild(wrap);
    wrap.focus(); // the overlay must hold focus to receive key events
    rdpActive = true;

    const w = Math.max(640, Math.min(view.clientWidth || 1024, 4096));
    const h = Math.max(480, Math.min((window.innerHeight - 30) || 768, 4096));
    const tunnel = new Guac.WebSocketTunnel("/api/targets/" + t.id + v.tunnel);
    const client = new Guac.Client(tunnel);
    const display = client.getDisplay();
    view.appendChild(display.getElement());

    let closed = false;
    const teardown = (msg, isErr) => {
      if (closed) return; closed = true; rdpActive = false;
      try { client.disconnect(); } catch (e) {}
      wrap.remove(); // drops the Keyboard/Mouse listeners bound to the overlay
      say(msg || (v.label + " SESSION TO " + String(t.name).toUpperCase() + " CLOSED."), !!isErr);
      render(); focusPrimary();
    };

    const mouse = new Guac.Mouse(view);
    mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = (state) => client.sendMouseState(state);
    const keyboard = new Guac.Keyboard(wrap);
    keyboard.onkeydown = (sym) => {
      // Ctrl+Alt+Q (q = keysym 0x071 / Q = 0x051) disconnects; return without
      // forwarding so the chord is never sent to the privileged remote session.
      if (keyboard.modifiers.ctrl && keyboard.modifiers.alt && (sym === 0x071 || sym === 0x051)) {
        teardown();
        return true;
      }
      client.sendKeyEvent(1, sym);
    };
    keyboard.onkeyup = (sym) => client.sendKeyEvent(0, sym);

    const errMsg = (st, what) => "CPF9999: " + what + " — " + String((st && st.message) || "error").toUpperCase();
    client.onerror = (st) => teardown(errMsg(st, v.label), true);
    tunnel.onerror = (st) => teardown(errMsg(st, v.label + " TUNNEL"), true);
    client.onstatechange = (state) => { if (state === 5) teardown(); };       // 5 = client DISCONNECTED
    tunnel.onstatechange = (state) => { if (state === 2) teardown(); };        // 2 = tunnel CLOSED (e.g. admin kill / clean server close)

    client.connect("token=" + encodeURIComponent(tok) + "&width=" + w + "&height=" + h);
  }

<form id="f-add" class="indent">
<label>Name  . . . . . . . :  <input name="name" size="20" required autofocus></label>
<label>Description . . . . :  <input name="description" size="40"></label>
<input type="submit" hidden>
</form>
${fkeys("F3=Exit   F12=Cancel")}`;
        document.getElementById("f-add").onsubmit = async (ev) => {

          catch (e) { say("CPF9898: " + e.message, true); render(); }

Editing safe <span class="white">${esc(s.name)}</span> (id ${esc(s.id)}). Members and targets are kept.

<form id="f-chg" class="indent">

${fkeys("F3=Exit   F12=Cancel")}`;

Members of safe <span class="white">${esc(sf ? sf.name : membersSafe)}</span> (id ${esc(membersSafe)}) — each may connect to

<form id="f-list"><table>

${safeMembers.map((m) => `<tr><td>${opt(m.id)}</td><td>${esc(m.id)}</td><td>${pad(m.subject_type, 10)}</td><td>${pad(m.subject, 18)}</td><td>${m.can_manage ? '<span class="amber">yes</span>' : "-"}</td></tr>`).join("")}

      safememberadd() {
        back = "safemembers";

Grant a subject access to every target in safe <span class="white">${esc(sf ? sf.name : membersSafe)}</span>.

<form id="f-add" class="indent">
<label>Subject type  . . . :  <select name="subject_type"><option>role</option><option>user</option></select>   <span class="cyan">role, user</span></label>

</form>
${fkeys("F3=Exit   F12=Cancel")}`;

      targetsafe() {

Placing target <span class="white">${esc(t.name)}</span> in a safe restricts it to the safe's members
(plus any direct target grants).

<form id="f-add" class="indent">
<label>Safe  . . . . . . . :  <select name="safe_id" autofocus>
<option value="">(none — remove from its safe)</option>
${safes.map((s) => `<option value="${esc(s.id)}"${t.safe_id === s.id ? " selected" : ""}>${esc(s.id)} — ${esc(s.name)}</option>`).join("")}
</select></label>
<input type="submit" hidden>
</form>${safes.length ? "" : `<div class="cyan indent">(No safes defined yet — create one in Work with Safes, menu 16.)</div>`}
${fkeys("F3=Exit   F12=Cancel")}`;
        document.getElementById("f-add").onsubmit = async (ev) => {
          ev.preventDefault();
          const v = ev.target.safe_id.value;
          try {
            await api("PUT", `/api/targets/${t.id}/safe`, { safe_id: v ? Number(v) : null });

      campaigns() {
        back = "main";
        const canManage = can("manage_users");
        term.innerHTML = `${head("PAMWRKCMP", "Certification Campaigns")}
Point-in-time access reviews: a campaign snapshots who has access to what; each
item is certified (kept) or revoked (the grant is deleted). Type options, press Enter.
  <span class="cyan">${["5=Review items", canManage ? "8=Close campaign" : ""].filter(Boolean).join("   ")}</span>

<form id="f-list"><table>
<tr><th>Opt</th><th>ID</th><th>Name</th><th>Status</th><th>Created by</th><th>Created</th><th>Due</th></tr>
${campaigns.map((c) => `<tr><td>${opt(c.id)}</td><td>${esc(c.id)}</td><td>${pad(c.name, 18)}</td><td class="${c.status === "open" ? "amber" : "cyan"}">${esc(c.status)}</td><td>${pad(c.created_by, 12)}</td><td class="cyan">${fmtTime(c.created_at)}</td><td class="cyan">${fmtTime(c.due_at)}</td></tr>`).join("")}
</table>${campaigns.length ? "" : `<div class="cyan indent">(No campaigns.${canManage ? " Press F6 to snapshot the current access grants into one." : ""})</div>`}
<input type="submit" hidden></form>
${fkeys(`F3=Exit   F5=Refresh${canManage ? "   F6=New campaign" : ""}   F12=Cancel`)}`;
        document.getElementById("f-list").onsubmit = async (ev) => {
          ev.preventDefault();
          try {
            for (const c of campaigns) {
              const o = optVal(ev.target, c.id);
              if (o === "5") { return openCampaign(c.id); }
              else if (o === "8") { await api("POST", `/api/campaigns/${c.id}/close`, {}); say(`CAMPAIGN ${String(c.name).toUpperCase()} CLOSED.`); }
              else if (o) { say("CPF0002: OPTION " + o.toUpperCase() + " NOT VALID.", true); }
            }
            await openCampaigns();
          } catch (e) { say("CPF9999: " + e.message, true); render(); }
        };
      },

      campaignadd() {
        back = "campaigns";
        term.innerHTML = `${head("PAMADDCMP", "New Certification Campaign")}
Snapshots every current target grant and safe member as reviewable items.

<form id="f-add" class="indent">
<label>Name  . . . . . . . :  <input name="name" size="28" required autofocus>   <span class="cyan">e.g. 2026-Q3 access review</span></label>
<label>Due date  . . . . . :  <input name="due" type="date" size="12">   <span class="cyan">optional</span></label>
<input type="submit" hidden>
</form>
${fkeys("F3=Exit   F12=Cancel")}`;
        document.getElementById("f-add").onsubmit = async (ev) => {
          ev.preventDefault();
          const f = Object.fromEntries(new FormData(ev.target));
          const body = { name: f.name };
          if (f.due) body.due_at = new Date(f.due + "T23:59:59").toISOString();
          try {
            const r = await api("POST", "/api/campaigns", body);
            say(`CAMPAIGN CREATED — ${r.items ?? 0} ITEM(S) CAPTURED.`);
            await openCampaigns();
          } catch (e) { say("CPF9898: " + e.message, true); render(); }
        };
      },

      campitems() {
        back = "campaigns";
        const cv = campView || { campaign: {}, items: [] };
        const c = cv.campaign, items = cv.items || [];
        const open = c.status === "open", canDecide = can("manage_users") && open;
        const decided = items.filter((i) => i.decision !== "pending").length;
        const dcls = { certified: "green", revoked: "red", pending: "amber" };
        term.innerHTML = `${head("PAMCMPITM", "Review Campaign Items")}
Campaign <span class="white">${esc(c.name)}</span> (id ${esc(c.id)}) — <span class="${open ? "amber" : "cyan"}">${esc(c.status)}</span>, ${decided}/${items.length} decided.
${canDecide ? `Type options, press Enter.  <span class="cyan">5=Certify (keep)   6=Revoke (DELETES the underlying grant)</span>` : `<span class="cyan">${open ? "(read-only — deciding needs manage_users)" : "(campaign closed — decisions are final)"}</span>`}

<form id="f-list"><table>
<tr><th>Opt</th><th>Item</th><th>Kind</th><th>Subject</th><th>Access</th><th>Decision</th><th>By</th></tr>
${items.map((i) => `<tr><td>${canDecide && i.decision === "pending" ? opt(i.id) : ""}</td><td>${esc(i.id)}</td><td>${pad(i.kind, 12)}</td><td>${pad(i.subject_type + ":" + i.subject, 18)}</td><td class="detail">${esc(i.detail)}</td><td class="${dcls[i.decision] || ""}">${esc(i.decision)}</td><td>${pad(i.decided_by || "-", 10)}</td></tr>`).join("")}
</table>${items.length ? "" : `<div class="cyan indent">(No items — there were no target grants or safe members to review when the campaign was created.)</div>`}
<input type="submit" hidden></form>
${fkeys("F3=Exit   F5=Refresh   F12=Cancel")}`;
        document.getElementById("f-list").onsubmit = async (ev) => {
          ev.preventDefault();
          try {
            for (const i of items) {
              const o = optVal(ev.target, i.id);
              if (o === "5") { await api("POST", `/api/campaigns/${c.id}/items/${i.id}/decision`, { decision: "certify" }); say(`ITEM ${i.id} CERTIFIED.`); }
              else if (o === "6") { await api("POST", `/api/campaigns/${c.id}/items/${i.id}/decision`, { decision: "revoke" }); say(`ITEM ${i.id} REVOKED — GRANT DELETED.`); }
              else if (o) { say("CPF0002: OPTION " + o.toUpperCase() + " NOT VALID.", true); }
            }
            await openCampaign(c.id);
          } catch (e) { say("CPF9999: " + e.message, true); render(); }
        };
      },

      risk() {
        back = "main";
        const r = risk;
        const lcls = { critical: "red", high: "amber", medium: "white" };
        const sigs = (f) => (f.signals || []).map((s) => `${s.name}=${s.points}`).join(" ");
        term.innerHTML = `${head("PAMRISK", "Risk Analytics")}
Behavioral risk over the recent audit window — every point traces to a named
signal (break-glass, blocked commands, auth failures, off-hours, velocity).

<form id="f-filter" class="indent">
<label>Minimum level . . . :  <select name="min">${["", "medium", "high", "critical"].map((l) => `<option value="${l}"${riskMin === l ? " selected" : ""}>${l || "(all)"}</option>`).join("")}</select>   Window (min) . . :  <input name="win" size="6" inputmode="numeric" value="${esc(riskWin)}" placeholder="default">   <span class="cyan">Enter=Rescore</span></label>
<input type="submit" hidden>
</form>
${r ? `<div class="white">Window: ${esc(r.window_minutes)} min   Events scored: ${esc(r.scored_events)}   Actors flagged: ${(r.findings || []).length}</div>
<table>
<tr><th>Actor</th><th>Score</th><th>Level</th><th>Signals</th><th>Events</th><th>Last activity</th></tr>
${(r.findings || []).map((f) => `<tr><td>${pad(f.actor, 16)}</td><td>${esc(f.score)}</td><td class="${lcls[f.level] || "green"}">${esc(f.level)}</td><td class="detail cyan">${esc(sigs(f))}</td><td>${esc(f.events)}</td><td class="cyan">${fmtTime(f.last_ts)}</td></tr>`).join("")}
</table>${(r.findings || []).length ? "" : `<div class="cyan indent">(No actors at or above the selected level in this window.)</div>`}` : `<div class="cyan indent">(No data — threat analytics may be disabled.)</div>`}
${fkeys("F3=Exit   F5=Refresh   F12=Cancel")}`;
        document.getElementById("f-filter").onsubmit = async (ev) => {
          ev.preventDefault();
          riskMin = ev.target.min.value;
          riskWin = ev.target.win.value.trim();
          try { await openRisk(); } catch (e) { say("CPF9999: " + e.message, true); render(); }
        };
      },

      recordings() {
        back = "main";
        const kb = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + "M" : n >= 1024 ? Math.round(n / 1024) + "K" : n + "B";
        term.innerHTML = `${head("PAMWRKREC", "Session Recordings (replay)")}
Stored recordings, newest first. Type options, press Enter.
  <span class="cyan">5=Replay</span>   <span class="cyan">Every replay is audited (session.playback) and hash-checked against the audit trail.</span>
  <span class="cyan">Target and actor come from the audit trail, so they show even when file names are opaque.</span>

<form id="f-list"><table>
<tr><th>Opt</th><th>Recording</th><th>Target</th><th>Actor</th><th>Kind</th><th>Size</th><th>Recorded</th></tr>
${recordings.map((c) => `<tr><td>${opt(c.name)}</td><td class="detail">${esc(c.name)}</td><td class="white">${pad(c.target || "-", 14)}</td><td>${pad(c.actor || "-", 12)}</td><td>${pad(c.kind, 10)}</td><td>${pad(kb(c.size), 7)}</td><td class="cyan">${fmtTime(c.modified)}</td></tr>`).join("")}
</table>${recordings.length ? "" : `<div class="cyan indent">(No recordings on disk yet — proxied sessions write asciicasts as they run.)</div>`}
<input type="submit" hidden></form>
${fkeys("F3=Exit   F5=Refresh   F12=Cancel")}`;
        document.getElementById("f-list").onsubmit = async (ev) => {
          ev.preventDefault();
          try {
            for (const c of recordings) {
              const o = optVal(ev.target, c.name);
              if (o === "5") { return openReplay(c); }
              else if (o) { say("CPF0002: OPTION " + o.toUpperCase() + " NOT VALID.", true); }
            }
            render();
          } catch (e) { say("CPF9999: " + e.message, true); render(); }
        };
      },

      recplay() {
        back = "recordings";
        const rp = replay || { name: "", kind: "", sha: "", audited: false, text: "" };
        term.innerHTML = `${head("PAMPLYREC", "Replay Recording")}
Recording <span class="white">${esc(rp.name)}</span>  (${esc(rp.kind)})
${rp.audited ? `<span class="green">HASH VERIFIED IN AUDIT TRAIL</span>` : `<span class="amber">HASH NOT FOUND IN AUDIT TRAIL — tampered, trimmed, or never audited</span>`}   <span class="cyan">sha256:${esc(rp.sha.slice(0, 16))}…</span>
<div id="rp-status" class="white"></div>
<div id="replay-pane" class="watchpane">${esc(rp.text)}</div>
${fkeys("Space=Pause/Play   F5=Restart   F6=Speed   F3=Exit   F12=Back")}`;
        replayStatus();
      },
    })[screen]();
    focusPrimary();
  }

  // focusPrimary lands the cursor on the screen's primary field after every
  // render, so the operator never has to reach for the mouse to start typing
  // (dynamically-inserted autofocus attributes do not reliably fire). Prefers an
  // explicit [autofocus], then the first real input/select, then a link.
  function focusPrimary() {
    const el = term.querySelector("[autofocus]") ||
      term.querySelector("input:not([type=hidden]):not([type=submit]):not([type=checkbox]), select, textarea") ||
      term.querySelector("a[href]");
    if (el) { try { el.focus({ preventScroll: false }); } catch (e) {} }
  }

  function auditRows(list) {
    return list.map((e) => { const bg = e.actor === "break-glass";
      return `<tr${bg ? ` class="red"` : ""}><td class="cyan">${fmtTime(e.ts)}</td><td>${bg ? `<span class="red blink">BREAK-GLASS</span>` : esc(e.actor)}</td><td>${esc(e.action)}</td><td class="detail">${esc(e.detail)}</td></tr>`; }).join("");
  }

  function go(s) {
    if (s !== "credview") viewCred = null;
    if (s !== "usercreated") newUser = null;
    if (s !== "appcreated") newApp = null;
    if (s !== "sesswatch") stopWatch();
    if (s !== "recplay") stopReplay();
    stopLive();
    screen = s; render(); msg = ""; msgErr = false;
  }
  function signoff() { stopLive(); stopWatch(); apiKey = ""; me = null; sessionStorage.removeItem("pam_api_key"); say("SIGN OFF COMPLETE."); go("signon"); }

  const refreshers = { targets: openTargets, creds: openCreds, sessions: openSessions, checkouts: openCheckouts, users: openUsers, mfa: openMfa, audit: openAudit, reconcile: openReconcile, requests: openRequests, grants: () => openGrants(grantsTarget), profiles: openProfiles, config: openConfig, effective: openEffective, apps: openApps, appgrants: () => openAppGrants(grantsApp), safes: openSafes, safemembers: () => openSafeMembers(membersSafe), campaigns: openCampaigns, campitems: () => campView && openCampaign(campView.campaign.id), risk: openRisk, recordings: openRecordings, brokerapprovals: openBrokerApprovals, stepups: openStepUps, vendors: openVendors, vendorgrants: () => openVendorGrants(grantsVendor), sshcerts: openSSHCerts, loginsessions: openLoginSessions, agents: openAgents, deps: () => depsCred && openDeps(depsCred.id) };
  const adders = { targets: () => go("targetadd"), creds: () => go("credadd"), grants: () => go("grantadd"), users: () => go("useradd"), requests: () => go("requestadd"), profiles: () => go("profileadd"), config: () => go("configset"), apps: () => go("appadd"), appgrants: () => go("appgrantadd"), safes: () => go("safeadd"), safemembers: () => go("safememberadd"), campaigns: () => go("campaignadd"), vendors: () => go("vendoradd"), vendorgrants: () => go("vendorgrantadd"), agents: () => go("agentadd"), deps: () => go("depadd") };

  window.addEventListener("keydown", async (ev) => {
    // While the RDP viewer is open it owns the keyboard (its own capture-phase
    // listener handles the Ctrl+Alt+Q disconnect); leave portal navigation inert.
    if (rdpActive) return;
    const k = ev.key;
    // Arrow keys move between subfile option cells (5250-style row navigation), so
    // a whole list of rows is operable without the mouse.
    if ((k === "ArrowDown" || k === "ArrowUp") && ev.target.classList && ev.target.classList.contains("opt")) {
      const opts = [...term.querySelectorAll("input.opt")];
      const i = opts.indexOf(ev.target);
      if (i >= 0) {
        ev.preventDefault();
        const next = opts[k === "ArrowDown" ? i + 1 : i - 1];
        if (next) next.focus();
      }
      return;
    }
    // Replay player controls (Phase 26): Space pauses/resumes, F5 restarts,
    // F6 cycles the speed — all without leaving the keyboard.
    if (screen === "recplay" && k === " ") { ev.preventDefault(); replayToggle(); return; }
    if (screen === "recplay" && (k === "F5" || k === "F6")) {
      ev.preventDefault();
      if (k === "F5") replayRestart(); else replayCycleSpeed();
      return;
    }
    // Esc cancels / goes back (the keyboard twin of F12), except at sign-on/main.
    if (k === "Escape") {
      if (screen === "signon" || screen === "main") return;
      ev.preventDefault();
      go(back);
      return;
    }
    if (!["F3", "F5", "F6", "F7", "F8", "F9", "F10", "F12"].includes(k)) return;
    ev.preventDefault();
    if (screen === "signon") return;
    try {
      if (k === "F3") { screen === "main" ? signoff() : go("main"); }
      else if (k === "F5") { const r = refreshers[screen]; if (r) await r(); else render(); }
      else if (k === "F6") { if (screen === "effective") await exportIaC("env"); else if (screen === "audit") await verifyChain(); else { const a = adders[screen]; if (a) a(); } }
      else if (k === "F7") { if (screen === "effective") await exportIaC("helm"); else if (screen === "audit") await fetchAuditHead(); }
      else if (k === "F8") { if (screen === "effective") await exportIaC("terraform"); }
      else if (k === "F9") { if (screen === "audit") await exportAudit(); else if (screen === "users") await reconcileIdentities(); else if (screen === "sshcerts") await download("/api/ca/ssh/krl", "pamv1-revoked-certs.krl", "KRL"); }
      else if (k === "F10") { if (screen === "audit") await download("/api/audit/ocsf", "pamv1-audit-ocsf.json", "OCSF"); }
      else if (k === "F12") { go(back); }
    } catch (e) { say("CPF9999: " + e.message, true); render(); }
  });

  setInterval(() => { const el = term.querySelector(".row .cyan"); if (el && screen !== "audit") el.textContent = now(); }, 1000);
  if (apiKey) { loadMe().then(render).catch(() => { apiKey = ""; me = null; screen = "signon"; render(); }); } else render();
})();
</script>
