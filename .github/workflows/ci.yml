name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: work around actions/go-versions lagging the latest Go patch
        # actions/setup-go's own version catalog (actions/go-versions) trails
        # a fresh upstream Go patch release by up to ~a day, so check-latest
        # above still resolved to go1.26.5 here even though go1.26.6 (fixing
        # 5-6 disclosed stdlib CVEs — net/url, crypto/tls, net/http,
        # encoding/xml, encoding/asn1) was already published on go.dev.
        # Fetch it directly, sha256-verified against the published digest,
        # and put it first on PATH for every step below. Safe to delete once
        # the upstream catalog catches up and check-latest alone is enough
        # again — try dropping this step first before adding a new one.
        run: |
          curl -sSL -o /tmp/go.tar.gz https://go.dev/dl/go1.26.6.linux-amd64.tar.gz
          echo "708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89  /tmp/go.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/go.tar.gz
          echo "/tmp/go/bin" >> "$GITHUB_PATH"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        # Catches bugs and deprecations go vet misses. @latest tracks the Go
        # toolchain (a pinned older staticcheck may not parse a new Go release).
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        # Fails the build on a KNOWN vulnerability that our code actually reaches
        # (in a dependency or the Go stdlib).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: gosec
        # Security static analysis. Deliberate findings are recorded inline with
        # `#nosec Gxxx -- reason`. Excluded rules are pervasively-deliberate or noisy
        # for a PAM and would only add suppression clutter:
        #   G104 unhandled errors  — best-effort audit/flush calls on cleanup paths
        #   G115 integer overflow  — safe conversions (TOTP counters, HMAC lengths)
        #   G304 file inclusion    — every hit loads an operator-configured file, not request input
        #   G306 WriteFile perms   — the archgen dev tool writing a public doc
        #   G101 hardcoded creds   — LOW-confidence false positives (capability-name maps, CHANGE_ME placeholders)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -quiet -confidence high -exclude=G104,G115,G306 ./...
      - name: build
        run: go build ./...
      - name: console
        # The portal is ~2,500 lines of JavaScript embedded in index.html, and
        # go:embed copies bytes without parsing them — so before this step a
        # syntax error compiled clean, tested clean, shipped, and broke the portal
        # at runtime. `node --version` runs FIRST and on its own line so a runner
        # without node fails the job: the Go tests skip themselves when node is
        # absent (which is right for a laptop) and that skip must never be how CI
        # passes.
        run: |
          node --version
          go test ./internal/web/ -run TestConsole -v
      - name: architecture diagrams up to date
        run: go run ./cmd/archgen && git diff --exit-code docs/ARCHITECTURE-DIAGRAMS.md
      - name: fuzz smoke (wire parsers)
        # The parsers in internal/tds and the SFTP inspector read attacker-influenced
        # bytes straight off an operator's connection; a panic or hang there is a
        # denial of service on the proxy. The seed corpus runs as a normal test in
        # the `test` step below (the regression guard); this step ALSO fuzzes each
        # target briefly, so a new crasher reachable within the budget fails the
        # build. Kept short to bound CI time; extend locally with a larger -fuzztime.
        run: |
          for t in FuzzParsePreLogin FuzzParseSQLBatch FuzzParseRPC; do
            go test -run '^$' -fuzz "$t" -fuzztime 20s ./internal/tds
          done
          go test -run '^$' -fuzz FuzzSFTPInspector -fuzztime 20s ./internal/proxy
      - name: test
        # -coverpkg=./... measures coverage across the WHOLE tree rather than
        # per-package. It matters here because this codebase deliberately tests
        # at the integration level: internal/api's tests drive most of the other
        # packages, and per-package accounting attributes none of that back to
        # them. Measured the naive way, internal/broker reads as 35% when it is
        # really 85% — a number low enough to send a reviewer chasing the wrong
        # problem, which is exactly what happened once.
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: coverage summary
        # Printed, not gated. A threshold picked today would be arbitrary; the
        # first useful thing is that a slide is visible in the log.
        #
        # THREE numbers, because one was misleading. This job has no database, so
        # internal/store/pgstore's ~900 statements are measured here as ~0 and
        # drag the headline down by about four points — while the pgstore job
        # actually exercises them and its coverage was never reported anywhere.
        # A reader comparing "73%" against another project's number was comparing
        # against a figure depressed by a package this repo tests deliberately
        # elsewhere. This codebase has been bitten by a coverage-measurement
        # artifact before (per-package accounting once sent a review after the
        # wrong problem), which is why the split is spelled out rather than left
        # to be rediscovered.
        #
        # All three come from `go tool cover` on filtered copies of the same
        # profile, so they are the same measurement and cannot disagree by method.
        run: |
          grep -v '/store/pgstore/' coverage.out > coverage-nopg.out
          grep -E '^(mode:|.*/store/pgstore/)' coverage.out > coverage-pg.out
          printf 'total, as measured here       : %s\n' "$(go tool cover -func=coverage.out    | tail -1 | awk '{print $NF}')"
          printf 'excluding internal/store/pgstore: %s   <- what this job exercises\n' "$(go tool cover -func=coverage-nopg.out | tail -1 | awk '{print $NF}')"
          printf 'internal/store/pgstore alone  : %s   <- needs a database; see the pgstore job\n' "$(go tool cover -func=coverage-pg.out   | tail -1 | awk '{print $NF}')"
          echo "--- full function report tail ---"
          go tool cover -func=coverage.out | tail -1
          echo "--- lowest-covered packages ---"
          go tool cover -func=coverage.out \
            | awk -F'[/:]' '/\.go:/ {print $0}' \
            | awk '{pkg=$1; sub(/\/[^/]*\.go.*/, "", pkg); n[pkg]++; s[pkg]+=$NF+0} END {for (p in n) printf "%6.1f%%  %s\n", s[p]/n[p], p}' \
            | sort -n | head -12

  # The PKCS#11 HSM KEK provider is behind the "pkcs11" build tag (cgo). Verify
  # it against SoftHSM2 — a software PKCS#11 token — so the HSM path is tested
  # without real hardware. The default `test` job never builds this code.
  pkcs11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: init token
        run: |
          export SOFTHSM2_CONF="$PWD/.softhsm2.conf"
          mkdir -p "$PWD/tokens"
          printf 'directories.tokendir = %s/tokens\nobjectstore.backend = file\nlog.level = ERROR\n' "$PWD" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label pamv1-test --pin 1234 --so-pin 5678
      - name: test (pkcs11 tag, cgo)
        run: |
          export SOFTHSM2_CONF="$PWD/.softhsm2.conf"
          MODULE=/usr/lib/softhsm/libsofthsm2.so
          [ -f "$MODULE" ] || MODULE=/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
          export PAM_TEST_PKCS11_MODULE="$MODULE"
          export PAM_TEST_PKCS11_PIN=1234
          export PAM_TEST_PKCS11_TOKEN=pamv1-test
          CGO_ENABLED=1 go test -tags pkcs11 ./internal/vault/ -run PKCS11 -v

  # Run the store conformance suite against a live PostgreSQL, so the pgstore
  # SQL and migrations are verified (the default `test` job skips it because
  # PAM_TEST_DATABASE_URL is unset).
  pgstore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pam
          POSTGRES_PASSWORD: pam
          POSTGRES_DB: pam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      # No -run filter: every test in the package must run. The live-Postgres
      # tests skip themselves without PAM_TEST_DATABASE_URL, so this job is the
      # ONLY place they execute — a filter here silently retires them. It once
      # read `-run PGStoreContract`, which matched the contract suite alone and
      # left the audit-chain tamper detection and the leader-lock mutual
      # exclusion (both backing security claims) running nowhere at all.
      # cmd/pam-server rides along for its Postgres-gated test (-rotate-kek end
      # to end). -p 1 serializes the two packages: they share one database, and
      # both truncate it on entry.
      - name: store tests (live Postgres)
        env:
          PAM_TEST_DATABASE_URL: postgres://pam:pam@localhost:5432/pam?sslmode=disable
        run: |
          go test -p 1 ./internal/store/pgstore/ ./cmd/pam-server/ -race -count=1 -v \
            -coverpkg=./internal/store/pgstore/ -coverprofile=coverage-pgstore.out
      - name: coverage (the half the test job cannot measure)
        # The other side of the split printed by the `test` job: pgstore's real
        # coverage, from the one job that has a database. Without this the
        # package looked untested in every report, because the only job that
        # measured it could not run it.
        run: go tool cover -func=coverage-pgstore.out | tail -1

  # Both images are built, not just the default one: the PKCS#11 flavour has its
  # own base, its own cgo build and its own build args, so it can break on its
  # own — and it went several phases without the version stamping the default
  # image had, which nothing here would have caught.
  #
  # DOCKER_BUILDKIT is explicit rather than assumed. The Dockerfiles use
  # `RUN --mount=type=cache`, which the classic builder rejects outright, so a
  # runner image that ever defaulted the other way would fail with a parse error
  # rather than silently building something else.
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image
        run: docker build -f deploy/docker/Dockerfile -t pamv1:ci .
      - name: build pkcs11 image
        run: docker build -f deploy/docker/Dockerfile.pkcs11 -t pamv1:ci-pkcs11 .

  # A broken chart or manifest should fail here, not at `kubectl apply` time:
  # helm lint, a full render of the chart (defaults and everything-on, so the
  # gated templates are exercised too), and kubeconform over the raw manifests
  # and both renders. CRD instances (the CloudNativePG Cluster, ServiceMonitor)
  # have no schema in the upstream catalog and are skipped, not failed.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: helm lint
        run: helm lint deploy/helm/pamv1
      - name: render chart (defaults, and everything on)
        # The chart deliberately refuses to render without a credentials source
        # (so PAM_MASTER_KEY cannot land in Helm release history) — provide one.
        run: |
          helm template pamv1 deploy/helm/pamv1 \
            --set secret.existingSecret=pam-secrets > /tmp/rendered-default.yaml
          helm template pamv1 deploy/helm/pamv1 \
            --set secret.create=true --set 'secret.data.PAM_MASTER_KEY=x' \
            --set ingress.enabled=true --set guacd.enabled=true \
            --set networkPolicy.enabled=true --set persistence.enabled=true \
            --set metrics.serviceMonitor.enabled=true > /tmp/rendered-all.yaml
      - name: kubeconform
        # conjur/policy.yaml is a Conjur policy document, not a K8s manifest,
        # and sops/ holds encrypted material — both stay out of scope.
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          "$(go env GOPATH)/bin/kubeconform" -summary -ignore-missing-schemas \
            deploy/k8s/*.yaml deploy/k8s/conjur/deployment.yaml deploy/k8s/flux/*.yaml \
            /tmp/rendered-default.yaml /tmp/rendered-all.yaml
      - name: kustomize bases build
        # The two bases are what `kubectl apply -k` and the Flux example both
        # resolve, so a broken resource list should fail here rather than at
        # reconcile time. The workload base is also checked to carry no secret
        # material: it exists precisely so the wholesale apply cannot sweep up
        # secret.example.yaml's CHANGE_ME values.
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.4.3
          KUSTOMIZE="$(go env GOPATH)/bin/kustomize"
          "$KUSTOMIZE" build deploy/k8s/ > /tmp/base.yaml
          "$KUSTOMIZE" build deploy/k8s/sops/ > /tmp/sealed.yaml
          if grep -qE 'CHANGE_ME|ENC\[AES256_GCM' /tmp/base.yaml; then
            echo "FAIL: the workload base contains placeholder or sealed material"; exit 1
          fi
          grep -q 'ENC\[AES256_GCM' /tmp/sealed.yaml || {
            echo "FAIL: the secrets base built without sealed values"; exit 1; }
          "$(go env GOPATH)/bin/kubeconform" -summary -ignore-missing-schemas /tmp/base.yaml

  # Phase 14: prove the committed SOPS example is really encrypted and round-trips
  # with the throwaway demo key (guards against an accidental plaintext commit).
  sops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: install sops + age
        run: |
          go install github.com/getsops/sops/v3/cmd/sops@v3.13.2
          go install filippo.io/age/cmd/age@v1.3.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: verify SOPS example
        run: ./deploy/k8s/sops/verify.sh
