name: Release

# Builds, pushes, SBOM-scans and signs the container image on a version tag.
#
# workflow_dispatch is the REHEARSAL, always — it builds the image for real and
# publishes nothing. It takes no input: it used to carry a `dry_run` boolean, and
# once the job stopped being skipped wholesale that boolean controlled nothing at
# all (`dry_run: false` behaved exactly like `true`), which is a lie in a
# pipeline's own interface. Removing it also removes the ability to publish a
# signed release from an arbitrary ref by hand, which is a control, not a loss:
# a real release comes from a version tag or it does not happen.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write      # create the GitHub Release
  packages: write      # push to GHCR
  id-token: write      # cosign keyless (OIDC) signing + provenance
  attestations: write  # SLSA build-provenance attestation

jobs:
  # ci.yml triggers on pushes to main and on pull requests — NOT on tags. Without
  # this job a tag could publish a signed, attested image built from a commit no
  # test ever ran against, which is precisely the assurance a signature is meant
  # to carry.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  # A rehearsal BUILDS. This job used to be skipped entirely on workflow_dispatch,
  # which made it a rehearsal that rehearsed nothing: the v0.11.1 tag failed in
  # `Build and push` on a cache backend the driver cannot export to, after six
  # green CI checks, and a rehearsal would have sailed past it too. Everything
  # with an outward effect — the push, the signature, the attestations, the
  # GitHub Release — is gated on REAL, which is set only by a tag push; the build
  # itself, which is the step that actually breaks, runs either way.
  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      REAL: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OCI names are lowercase; the GitHub repository (`PAMv1` since it was
      # renamed alongside Phase 213) is not. This used to be a workflow-level
      # `IMAGE: ghcr.io/${{ github.repository }}`, and the v0.58.0 tag showed why
      # that cannot work: docker/metadata-action lowercases the tags it emits,
      # so the build and push succeeded, and then `Generate SBOM` — which, like
      # `cosign sign` and both attestations, assembles its reference from the
      # raw variable — refused `ghcr.io/morandeirachema/PAMv1@sha256:…`. An
      # image that nothing verifies was left under a release tag. The name is
      # lowercased once here, an uppercase survivor fails the job outright, and
      # this step runs in the rehearsal too, so a regression fails a dry run
      # before it burns a tag.
      - name: Image name (lowercase, or refuse)
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$image" in
            *[A-Z]*) echo "::error::image reference must be lowercase, got $image"; exit 1 ;;
          esac
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "image=$image"

      - name: Log in to GHCR
        if: env.REAL
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          push: ${{ env.REAL == '1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NO cache-from/cache-to here, deliberately. Phase 64 added them and the
          # v0.11.1 tag failed outright — `type=gha` needs the docker-container
          # driver, and this job uses buildx's default `docker` driver, which
          # cannot export cache at all.
          #
          # The fix is not to add a driver. A release is the one build whose speed
          # matters least and whose provenance matters most: a signed, attested
          # artifact is a stronger claim when nothing outside this commit fed the
          # compiler. The Dockerfile's `RUN --mount=type=cache` mounts stay — with
          # no cache backend attached they simply start empty here, so the release
          # builds cold by construction, while the same Dockerfile still caches for
          # everyday `docker build` and `docker compose build`.

      - name: Generate SBOM (SPDX)
        if: env.REAL
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install cosign
        if: env.REAL
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: env.REAL
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest the SBOM
        if: env.REAL
        run: |
          cosign attest --yes --predicate sbom.spdx.json \
            --type spdxjson ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest build provenance (SLSA)
        if: env.REAL
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The outbound-only endpoint agent (Phase 153) runs ON endpoints, not in
      # the pam-server image, so it ships as static binaries on the Release —
      # built here from the same checkout the image was built from, stamped
      # with the same version/commit, with a SHA256SUMS file to verify against.
      # Built in the rehearsal too (the step that can break), attached only on
      # a real tag push like everything else with an outward effect.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Build pam-agent binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" \
              -o "dist/pam-agent_linux_${arch}" ./cmd/pam-agent
          done
          (cd dist && sha256sum pam-agent_linux_* > SHA256SUMS)
          ls -l dist

      - name: Create GitHub Release
        if: env.REAL
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            sbom.spdx.json
            dist/pam-agent_linux_amd64
            dist/pam-agent_linux_arm64
            dist/SHA256SUMS
