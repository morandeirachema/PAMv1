name: Release

# Builds, pushes, SBOM-scans and signs the container image on a version tag.
#
# workflow_dispatch is the REHEARSAL, always — it builds the image for real and
# publishes nothing. It takes no input: it used to carry a `dry_run` boolean, and
# once the job stopped being skipped wholesale that boolean controlled nothing at
# all (`dry_run: false` behaved exactly like `true`), which is a lie in a
# pipeline's own interface. Removing it also removes the ability to publish a
# signed release from an arbitrary ref by hand, which is a control, not a loss:
# a real release comes from a version tag or it does not happen.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write      # create the GitHub Release
  packages: write      # push to GHCR
  id-token: write      # cosign keyless (OIDC) signing + provenance
  attestations: write  # SLSA build-provenance attestation

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ci.yml triggers on pushes to main and on pull requests — NOT on tags. Without
  # this job a tag could publish a signed, attested image built from a commit no
  # test ever ran against, which is precisely the assurance a signature is meant
  # to carry.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  # A rehearsal BUILDS. This job used to be skipped entirely on workflow_dispatch,
  # which made it a rehearsal that rehearsed nothing: the v0.11.1 tag failed in
  # `Build and push` on a cache backend the driver cannot export to, after six
  # green CI checks, and a rehearsal would have sailed past it too. Everything
  # with an outward effect — the push, the signature, the attestations, the
  # GitHub Release — is gated on REAL, which is set only by a tag push; the build
  # itself, which is the step that actually breaks, runs either way.
  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      REAL: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        if: env.REAL
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          push: ${{ env.REAL == '1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NO cache-from/cache-to here, deliberately. Phase 64 added them and the
          # v0.11.1 tag failed outright — `type=gha` needs the docker-container
          # driver, and this job uses buildx's default `docker` driver, which
          # cannot export cache at all.
          #
          # The fix is not to add a driver. A release is the one build whose speed
          # matters least and whose provenance matters most: a signed, attested
          # artifact is a stronger claim when nothing outside this commit fed the
          # compiler. The Dockerfile's `RUN --mount=type=cache` mounts stay — with
          # no cache backend attached they simply start empty here, so the release
          # builds cold by construction, while the same Dockerfile still caches for
          # everyday `docker build` and `docker compose build`.

      - name: Generate SBOM (SPDX)
        if: env.REAL
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install cosign
        if: env.REAL
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: env.REAL
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest the SBOM
        if: env.REAL
        run: |
          cosign attest --yes --predicate sbom.spdx.json \
            --type spdxjson ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest build provenance (SLSA)
        if: env.REAL
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        if: env.REAL
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: sbom.spdx.json
