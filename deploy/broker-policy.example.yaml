# Example AI-agent access-broker policy (point PAM_BROKER_POLICY_FILE at a copy).
#
# The broker evaluates this on every agent tool call. First matching rule wins;
# a call that matches no rule is an implicit deny (fail-closed). Conditions match
# the tool's arguments as args.<field> with:
#   value                equality
#   { not: X }           present and differs
#   { in: [A, B] }       present and in the allow-list  (prefer allow-lists)
#   { not_in: [X] }      present and not in the block-list
#   { present: true }    the argument was supplied (any value)
#   { present: false }   the argument was NOT supplied
#   { gte|gt|lte|lt: N } present, numeric, and compares that way
# There is deliberately no regex, OR, or nesting. Keep this file in version
# control; policy changes take effect on restart.
#
# EVERY value operator needs the argument to be there — the negative ones, `not`
# and `not_in`, included. That is worth stating because it used to be otherwise,
# and the old behaviour was a trap: `{ not_in: [vault-prod] }` also matched when
# the agent sent no such argument at all, so a rule written to keep an agent away
# from a target was defeated by simply omitting the target. Tools with an
# OPTIONAL filter argument — list_credentials is one; no `target` means "list
# every credential" — turned that into a full bypass. An omitted argument now
# fails the condition, and the call falls through to the next rule and finally to
# the default deny.
#
# `present` is how you talk about the argument itself rather than its value, and
# `{ present: false }` is the direct way to write "the unscoped, list-everything
# form of this call is not allowed". Careful: present means SUPPLIED, not
# non-empty — an argument sent as "" is present. So a block-list over an optional
# filter is still weaker than an allow-list (an empty string passes `not_in` and
# may still mean "no filter" to the tool); prefer `{ in: [...] }` when you can.
#
# Tools available to agents: winrm_exec, ssh_exec (one-shot command; JIT
# credential, only the output returns), list_targets, list_credentials (metadata
# only), rotate_credential (new secret stays vaulted), and reveal_credential (the
# deliberate secret-returning tool — leave it with NO allow rule to keep it
# default-denied, which is the recommended posture).
rules:
  # Run a command on an allow-listed lab host, with a scoped, short-lived grant.
  - id: exec-on-lab
    tool: winrm_exec
    when:
      args.target: { in: [lab-win-01, lab-win-02] }
    effect: allow
    scope: "target:{target}:exec"
    ttl_seconds: 60

  # Read-only inventory is always safe to allow (no secrets are ever returned).
  - id: read-inventory
    tool: list_targets
    effect: allow
  # Credential metadata never includes a secret, but `list_credentials` with no
  # `target` lists EVERY credential in the system — inventory an agent has no
  # reason to hold. Deny the unscoped form first (this is what `present: false`
  # is for), then allow the scoped one.
  - id: no-unscoped-credential-listing
    tool: list_credentials
    when:
      args.target: { present: false }
    effect: deny
    reason: list_credentials must name a target
  - id: read-credentials-metadata
    tool: list_credentials
    effect: allow

  # Anything on production requires a human: the call parks, an approver decides
  # via /v1/approvals, and on approval the broker executes it server-side (JIT).
  - id: exec-on-prod-needs-approval
    tool: winrm_exec
    when:
      args.target: { in: [prod-win-01, prod-win-02] }
    effect: require_approval
    approvers: [platform-team]
    scope: "target:{target}:exec"

  # Everything else is denied by default (no matching rule). reveal_credential is
  # intentionally absent here, so it stays default-denied; add an allow rule only
  # if an agent genuinely must hold a secret, and prefer ssh_exec/winrm_exec so
  # the credential never leaves the broker.
