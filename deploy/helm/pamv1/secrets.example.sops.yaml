# Example SOPS-sealed Helm values for pamv1 (Phase 79).
#
# The SOPS README has always pointed at `helm secrets` as the Helm route, and
# .sops.yaml has always carried a creation rule for `helm/**/secrets*.yaml` --
# but there was no example behind either, so "supported" meant "you work it out".
# This is that example, and it is really sealed: the PAM_* values below are
# ciphertext, verifiable with deploy/k8s/sops/verify.sh.
#
# Install with the helm-secrets plugin (https://github.com/jkroepke/helm-secrets):
#
#   helm plugin install https://github.com/jkroepke/helm-secrets
#   export SOPS_AGE_KEY_FILE=age.key          # YOUR key, not the demo one below
#   helm secrets upgrade --install pamv1 deploy/helm/pamv1 \
#     -n pamv1 --create-namespace -f secrets.sops.yaml
#
# `helm secrets` decrypts this file into a temp values file for the duration of
# the command and shreds it afterwards, so the plaintext never lands on disk in
# the repo and never appears in `helm get values`.
#
# >>> This file is sealed to the THROWAWAY demo key deploy/k8s/sops/age-example.key,
#     whose private half is committed. Nothing here is secret. For a real
#     deployment, copy this file to secrets.sops.yaml, put your own values in,
#     and seal it to your own recipient:
#
#       cp deploy/helm/pamv1/secrets.example.sops.yaml deploy/helm/pamv1/secrets.sops.yaml
#       # edit in the real values as plaintext, then:
#       sops --config deploy/.sops.yaml -e -i deploy/helm/pamv1/secrets.sops.yaml
#
#     `deploy/helm/**/secrets.sops.yaml` is gitignored for the same reason the
#     k8s one is: it stops a half-finished file being committed before you have
#     confirmed it is sealed. Commit it with `git add -f` once you have.
