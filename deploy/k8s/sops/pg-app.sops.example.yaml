# The CloudNativePG application credentials, sealed (Phase 79).
#
# Why this file exists: deploy/k8s/postgres-cnpg.yaml lets CNPG GENERATE the app
# password into a secret it manages. That works, and it puts a manual step in the
# middle of a deployment that is otherwise IaC end to end -- somebody has to read
# the generated password out of the running cluster and paste it into pamv1's own
# PAM_DATABASE_URL. Two copies of one password, kept in step by hand.
#
# Supplying the secret instead makes the password an input rather than an output:
# it is sealed here, CNPG is pointed at it (see postgres-cnpg.yaml), and pamv1's
# PAM_DATABASE_URL uses the same value. Nothing is read back out of the cluster.
#
# The `username` and `password` keys are the shape CNPG's bootstrap.initdb.secret
# expects (kubernetes.io/basic-auth).
#
# >>> Sealed to the THROWAWAY demo key deploy/k8s/sops/age-example.key. Nothing
#     here is secret. Copy to pg-app.sops.yaml, put a real password in, and seal
#     it to your own recipient before using it.
apiVersion: v1
kind: Secret
metadata:
    name: pamv1-pg-app
    namespace: pamv1
    labels:
        cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
