# PAMv1 — the secret-valued configuration for Kubernetes.
#
# Everything PAMv1 reads that is a credential, a key, or a key-derived hash lives
# here. The non-secret knobs are the other half of the pair,
# configmap.example.yaml — keep each variable in exactly one of the two.
#
# To keep this secret encrypted IN the IaC repo, use SOPS instead — see
# deploy/k8s/sops/ (Phase 14). Otherwise, copy to secret.yaml (git-ignored) or
# create via kubectl:
#   kubectl -n PAMv1 create secret generic pam-secrets \
#     --from-literal=PAM_MASTER_KEY=... \
#     --from-literal=PAM_API_KEY=... \
#     --from-literal=PAM_BREAK_GLASS_KEY_HASH=... \
#     --from-literal=PAM_DATABASE_URL='postgres://pam:...@pamv1-pg-rw:5432/pam?sslmode=verify-full'
#
# A third option keeps bootstrap secrets out of the cluster entirely: leave them
# EMPTY here and let PAMv1 fetch them from CyberArk Conjur at startup (see
# deploy/k8s/conjur/ and the PAM_CONJUR_* block in the ConfigMap). An explicit
# value always wins over a sourced one.
#
# PAM_DATABASE_URL points at the CloudNativePG read-write service (postgres-cnpg.yaml):
# `pamv1-pg-rw` always resolves to the current primary, so writes follow an
# automatic failover. The app user's password lives in the CNPG-managed secret
# `pamv1-pg-app` — copy it in here:
#   kubectl -n PAMv1 get secret pamv1-pg-app -o jsonpath='{.data.password}' | base64 -d
# (or reference that secret's ready-made `uri` key straight from the Deployment).
#
# Prefer sslmode=verify-full. It is not only the database password on the wire:
# since Phase 55 the store connection also carries the cross-replica
# live-monitoring relay, so watched-session output crosses it too.
apiVersion: v1
kind: Secret
metadata:
  name: pam-secrets
  namespace: pamv1
type: Opaque
stringData:
  # --- Required ------------------------------------------------------------
  # PAM_MASTER_KEY is the local-provider KEK (32 bytes, urlsafe base64):
  #   ./pam-server -genkey
  # In production prefer an external KEK (PAM_KEK_PROVIDER=vault-transit|aws-kms|
  # pkcs11, in the ConfigMap) and leave this empty — the wrapping key then never
  # enters the cluster at all.
  PAM_MASTER_KEY: "CHANGE_ME"
  # The bootstrap admin key: the X-API-Key header, portal sign-on, AND the
  # password for the SSH/PostgreSQL/SQL Server proxies. Treat it as a root
  # credential. Minimum 16 characters against a real database.
  PAM_API_KEY: "CHANGE_ME"
  PAM_DATABASE_URL: "postgres://pam:CHANGE_ME@pamv1-pg-rw:5432/pam?sslmode=verify-full"

  # --- Break-glass ---------------------------------------------------------
  # Only the SHA-256 hash of the emergency key is ever stored:
  #   echo -n "the-emergency-key" | ./pam-server -hashkey
  # Keep the plaintext sealed offline. For M-of-N quorum unseal, split it with
  # `-split-key` and set PAM_BREAK_GLASS_THRESHOLD/_SHARES in the ConfigMap.
  PAM_BREAK_GLASS_KEY_HASH: ""

  # --- Tamper-evident audit trail ------------------------------------------
  # Both are base64 32-byte values:  openssl rand -base64 32
  # The HMAC key enables the hash chain over the primary audit trail; the seed
  # signs the head checkpoints that make tail truncation detectable.
  # Back the HMAC key up with the same care as the KEK — losing it makes honest
  # history verify as tampered. With the chain on, the retention worker
  # deliberately archives audit rows without pruning them.
  # PAM_AUDIT_HMAC_KEY: ""
  # PAM_AUDIT_SIGN_SEED: ""

  # --- AI-agent broker audit chain -----------------------------------------
  # Optional since the Phase 13 follow-on: left unset, each key is generated once
  # and held under shared custody (KEK-sealed in the database, converged on by
  # every replica, re-wrapped by -rotate-kek). Set them explicitly only to pin a
  # signer or to drive a signer rotation.
  # PAM_BROKER_AUDIT_KEY: ""
  # PAM_BROKER_AUDIT_SIGN_SEED: ""
  # Comma-separated base64 ed25519 PUBLIC keys still trusted during a rotation:
  # PAM_BROKER_AUDIT_SIGN_PREV: ""

  # --- External KEK providers ----------------------------------------------
  # Whichever provider the ConfigMap selects, its credential belongs here.
  # PAM_KEK_TRANSIT_TOKEN: ""      # HashiCorp Vault Transit token
  # PAM_KEK_PKCS11_PIN: ""         # HSM PIN (pkcs11-tagged image only)
  # aws-kms uses the AWS credential chain (IRSA / instance role) — no secret here.

  # --- Directory and SSO ---------------------------------------------------
  # PAM_LDAP_BIND_PASSWORD: ""     # service account used for the user search
  # PAM_ENTRA_CLIENT_SECRET: ""
  # PAM_OIDC_CLIENT_SECRET: ""

  # --- Alerting ------------------------------------------------------------
  # PAM_ALERT_EMAIL_PASS: ""       # SMTP password

  # --- Conjur (only when authenticating with authn-api-key) ----------------
  # authn-jwt needs no secret here — it uses the pod's projected token.
  # PAM_CONJUR_API_KEY: ""

  # --- KEK rotation (offline `-rotate-kek` runs only) ----------------------
  # The TARGET key for a rotation. Set it for the one-shot rotation job, then
  # remove it and promote the new key to PAM_MASTER_KEY / PAM_KEK_*.
  # Retain the OLD KEK for as long as you retain sealed recordings: their data
  # keys are wrapped inside the files and are deliberately not re-wrapped.
  # PAM_NEW_MASTER_KEY: ""
