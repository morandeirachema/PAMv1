# pamv1 as an External Secrets Operator backend, through ESO's generic webhook
# provider (Phase 197).
#
# Why the webhook provider and not a bespoke one: ESO's webhook backend is a
# plain templated HTTP call with JSONPath extraction, and pamv1 already vends
# secrets to machines over exactly that shape — an application key in a bearer
# header, default-deny per grant, and a fail-closed audit written BEFORE the
# secret leaves. Nothing new had to be invented on either side.
#
# What `remoteRef.key` names: the grant's ALIAS, not a credential row id. Set one
# with
#   curl -X POST -H "X-API-Key: $PAM_API_KEY" \
#        -d '{"alias":"prod-db-password"}' \
#        https://pamv1/v1/apps/$APP_ID/grants/$GRANT_ID/alias
# An alias is stable, operator-chosen and scoped to the application, which is
# what makes it safe to commit in a manifest. A credential's BIGSERIAL id is not.
# ⚠️ THIS URL IS https:// AND THE REFERENCE DEPLOYMENT SERVES PLAIN HTTP.
# deploy/k8s/deployment.yaml sets no PAM_TLS_CERT / PAM_TLS_KEY — the only two
# variables that turn on HTTPS — and its own probes use plain httpGet on 8080. So
# applying deploy/k8s/ and then this file gives you a TLS handshake against an
# HTTP listener and every sync fails. Before this works, do one of:
#
#   * set PAM_TLS_CERT and PAM_TLS_KEY (both, or neither — the config refuses a
#     half-configured pair) and mount the certificate into the deployment; or
#   * terminate TLS at an ingress and point this url at that instead.
#
# It is left as https:// on purpose. This endpoint hands out plaintext secrets;
# defaulting the example to http:// would make the insecure path the easy one.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pamv1
spec:
  provider:
    webhook:
      url: "https://pamv1.pamv1.svc:8080/v1/app-secrets/by-alias/{{ .remoteRef.key }}"
      headers:
        Authorization: "Bearer {{ .creds.token }}"
      result:
        # pamv1 answers {"credential_id":…,"target":…,"username":…,"secret":…}
        jsonPath: "$.secret"
      secrets:
        - name: creds
          secretRef:
            name: pamv1-app-key
      # pamv1 serves TLS from its own CA in most deployments; point this at it
      # rather than disabling verification. Drop the block only if you terminate
      # TLS at an ingress with a publicly trusted certificate.
      caProvider:
        type: Secret
        name: pamv1-ca
        key: ca.crt
---
# The application key pamv1 minted (POST /v1/apps returns the token exactly
# once). Create it out of band — this file deliberately carries no secret:
#
#   kubectl -n pamv1 create secret generic pamv1-app-key \
#     --from-literal=token='<the token POST /v1/apps returned>'
apiVersion: v1
kind: Secret
metadata:
  name: pamv1-app-key
stringData:
  token: CHANGE_ME
