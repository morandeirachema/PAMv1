# One workload secret, sourced from pamv1 and refreshed on a schedule.
#
# refreshInterval is a real trade-off, not a default to copy blindly: every
# refresh is an authenticated, audited retrieval in pamv1's trail, so a short
# interval buys faster propagation of a rotation at the cost of a busier ledger.
# One hour suits a credential pamv1 rotates after each session; shorten it if you
# rotate on a tighter cycle.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pamv1
    kind: SecretStore
  target:
    name: app-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        # The grant alias, as set on POST /v1/apps/{id}/grants/{gid}/alias.
        key: prod-db-password
