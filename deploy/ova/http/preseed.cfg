# pamv1 appliance — Debian 13 (trixie) unattended install.
#
# Consumed by debian-installer via preseed/url=. Everything here is deliberately
# minimal: an appliance for a privileged-access system should be the least
# surprising thing on the network, so there is no desktop, no printing stack, and
# nothing listening that the product does not need.
#
# NOTE ON CREDENTIALS: no long-lived secret is set here. The build user password
# below is a first-login placeholder that is force-expired, and pamv1's own keys
# (PAM_MASTER_KEY, PAM_API_KEY) are generated on FIRST BOOT of the imported VM —
# see provision/40-firstboot.sh. Shipping an OVA with a fixed vault key would
# mean every copy of the appliance shares one root of trust.

### Locale, keyboard, console
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

### Network — DHCP; the hostname is fixed so the console banner is predictable
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string pamv1
d-i netcfg/get_domain string local
d-i netcfg/hostname string pamv1
# A missing DHCP lease should fail the build loudly, not drop to a dialog
d-i netcfg/dhcp_timeout string 60
d-i netcfg/dhcpv6_timeout string 60

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### Accounts
# Root login is disabled outright (no password set); administration is via the
# `pam` account with sudo, matching how Debian cloud images behave.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string pamv1 appliance admin
d-i passwd/username string pam
# Placeholder only — provision/40-harden.sh force-expires it, so the first
# console/SSH login must set a new one before a shell is granted.
d-i passwd/user-password password pamv1
d-i passwd/user-password-again password pamv1
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Partitioning — one ext4 root + swap, no LVM, no encryption.
# Deliberate: the appliance disk is expected to sit on an encrypted host volume
# or an encrypted datastore. LUKS inside the OVA would need a passphrase at every
# boot, which an unattended appliance cannot supply without storing the key next
# to the data it protects.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true

### Base system
d-i base-installer/install-recommends boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
tasksel tasksel/first multiselect standard, ssh-server
# postgresql: the appliance's store. ca-certificates: TLS to targets/IdPs.
# The rest is the minimum needed to administer a headless box.
# systemd-resolved is its OWN package since Debian 12 — a minimal install does not
# get it, and provisioning needs it because the appliance resolves DNS through
# systemd-networkd (see provision/10-base.sh).
d-i pkgsel/include string postgresql ca-certificates sudo curl chrony less vim-tiny systemd-resolved
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### Finish without prompting; the build harness powers the VM off
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true

### Provisioning
# late_command runs in /target before first boot. It pulls the payload the build
# harness is serving (the pamv1 binary, the source tree, unit files and the
# provision scripts) and runs them inside the installed system.
#
# NOTE ON QUOTING — this is easy to get wrong and it fails SILENTLY: the
# installer hands the whole value to `sh -c`, so nested double quotes inside a
# `sh -c "..."` swallow the rest of the command and the provisioning simply never
# happens, leaving an installed-but-empty appliance. Every step below is a bare
# `in-target <cmd> <args>` with no inner quotes, no pipes and no redirection;
# anything needing a shell lives inside run-all.sh instead.
d-i preseed/late_command string \
    in-target mkdir -p /opt/pamv1 ; \
    in-target curl -fsSL -o /opt/pamv1/payload.tar.gz http://10.0.2.2:8099/payload.tar.gz ; \
    in-target tar -xzf /opt/pamv1/payload.tar.gz -C /opt/pamv1 ; \
    in-target rm -f /opt/pamv1/payload.tar.gz ; \
    in-target sh /opt/pamv1/provision/run-all.sh
